<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Heineken Jigsaw Puzzle</title>
<style>
  :root {
    --hk-green: #00853f;
    --hk-green-dark: #00622e;
    --hk-red: #e2231a;
    --bg: #0b0d0c;
    --bg-soft: #14181a;
    --tray-bg: #f6f3eb;
    --board-bg: #00853f;
    --board-shadow: rgba(0,0,0,0.45);
    --piece-shadow: 0 6px 14px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.55);
    --piece-shadow-lift: 0 18px 32px rgba(0,0,0,0.55), 0 4px 10px rgba(0,0,0,0.6);
    --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: radial-gradient(ellipse at top, #1a1f1c 0%, var(--bg) 60%, #050706 100%);
    color: #fff;
    font-family: var(--font);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0));
    z-index: 100;
    pointer-events: none;
    gap: 12px;
  }

  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; letter-spacing: 0.04em;
    font-size: 22px;
  }
  .brand .star {
    width: 22px; height: 22px;
    color: var(--hk-red);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
  }
  .brand .word { font-style: italic; font-family: 'Georgia', serif; }

  .timer {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.06em;
    padding: 6px 14px;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .controls {
    display: flex; gap: 8px; align-items: center;
    pointer-events: auto;
  }
  .ctrl-btn {
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.18);
    color: white;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    font: 600 13px var(--font);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background 160ms ease, border-color 160ms ease, transform 80ms ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .ctrl-btn:hover { background: rgba(0,0,0,0.7); border-color: rgba(255,255,255,0.35); }
  .ctrl-btn:active { transform: scale(0.94); }
  .ctrl-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .ctrl-btn.active { background: var(--hk-red); border-color: var(--hk-red); }
  .ctrl-btn .count { opacity: 0.75; font-weight: 400; }

  /* Snap success glow */
  .snap-glow {
    position: fixed;
    border: 3px solid #5cffb1;
    border-radius: 6px;
    box-shadow: 0 0 28px 6px rgba(92,255,177,0.65), inset 0 0 14px rgba(92,255,177,0.4);
    pointer-events: none;
    z-index: 450;
    animation: snap-glow 650ms ease-out forwards;
  }
  @keyframes snap-glow {
    0%   { opacity: 0; transform: scale(0.85); }
    25%  { opacity: 1; transform: scale(1.12); }
    100% { opacity: 0; transform: scale(1.02); }
  }

  /* Hint slot pulse */
  .hint-pulse {
    position: absolute;
    border: 3px dashed #ffd700;
    border-radius: 6px;
    box-shadow: 0 0 30px 8px rgba(255,215,0,0.6), inset 0 0 18px rgba(255,215,0,0.45);
    pointer-events: none;
    z-index: 80;
    animation: hint-pulse 2200ms ease-out forwards;
    background: rgba(255,215,0,0.10);
  }
  @keyframes hint-pulse {
    0%   { opacity: 0; transform: scale(0.9); }
    18%  { opacity: 1; transform: scale(1.08); }
    50%  { opacity: 0.8; transform: scale(1.02); }
    100% { opacity: 0; transform: scale(1.04); }
  }

  /* Toast (share confirmation) */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    font: 600 14px var(--font);
    letter-spacing: 0.04em;
    z-index: 800;
    opacity: 0;
    transition: opacity 240ms ease, transform 240ms ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Piece rotation handle indicator on hover (hard mode) */
  .piece.rotatable:not(.locked):not(.dragging):hover {
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45)) drop-shadow(0 0 8px rgba(255,215,0,0.5));
  }

  main {
    position: absolute;
    top: 64px; bottom: 0; left: 0; right: 0;
    display: flex;
  }

  .tray, .board {
    position: relative;
    flex: 1 1 50%;
    overflow: hidden;
  }
  .tray {
    background:
      radial-gradient(ellipse at 30% 20%, #ffffff 0%, var(--tray-bg) 60%, #e6e1d4 100%);
    border-right: 1px solid rgba(0,0,0,0.2);
  }
  .board {
    background:
      radial-gradient(ellipse at 50% 30%, #00a14e 0%, var(--hk-green) 50%, var(--hk-green-dark) 100%);
  }

  /* container that holds the board grid centred */
  .board-stage, .tray-stage {
    position: absolute;
    inset: 0;
  }

  /* board target outline */
  .target-frame {
    position: absolute;
    border: 2px solid rgba(0,0,0,0.35);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 25px 50px -12px var(--board-shadow);
    background: rgba(0,0,0,0.18);
    border-radius: 4px;
    pointer-events: none;
  }
  .slot-grid {
    position: absolute;
    pointer-events: none;
    /* faint outlines drawn via SVG inside */
  }

  /* SVG defs container - hidden visually */
  .defs-svg { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* Each piece is an absolutely positioned div containing an SVG */
  .piece {
    position: absolute;
    cursor: grab;
    will-change: transform;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45));
    transition: filter 160ms ease;
    touch-action: none;
  }
  .piece.dragging {
    cursor: grabbing;
    filter: drop-shadow(0 16px 24px rgba(0,0,0,0.6));
    z-index: 1000;
  }
  .piece.locked {
    cursor: default;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    pointer-events: none;
    transition: filter 240ms ease;
  }
  .piece.snap-anim {
    transition: transform 180ms cubic-bezier(.2,.8,.2,1);
  }
  .piece.return-anim {
    transition: transform 320ms cubic-bezier(.34,1.56,.64,1);
  }

  /* idle wobble for tray pieces */
  @keyframes wobble {
    0%, 100% { transform: translate(var(--tx,0), var(--ty,0)) rotate(var(--rot,0deg)); }
    50% { transform: translate(var(--tx,0), calc(var(--ty,0) - 1.5px)) rotate(calc(var(--rot,0deg) + 0.4deg)); }
  }

  .piece svg { display: block; overflow: visible; }

  /* Win overlay */
  .win-overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55), rgba(0,0,0,0.85));
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 600ms ease;
    z-index: 500;
  }
  .win-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .win-card {
    text-align: center;
    padding: 36px 56px;
    background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 16px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    transform: translateY(20px) scale(0.95);
    transition: transform 600ms cubic-bezier(.2,.8,.2,1);
  }
  .win-overlay.visible .win-card { transform: translateY(0) scale(1); }
  .win-card .star {
    width: 48px; height: 48px; color: var(--hk-red);
    margin-bottom: 8px;
  }
  .win-card h1 {
    margin: 0 0 6px; font-size: 32px; letter-spacing: 0.04em;
    font-family: 'Georgia', serif; font-style: italic;
  }
  .win-card p {
    margin: 0; font-size: 18px; color: rgba(255,255,255,0.75);
    font-variant-numeric: tabular-nums;
  }

  /* Bottle cap overlay (rendered above board after win) */
  .bottle-cap {
    position: fixed;
    z-index: 540;
    pointer-events: none;
    will-change: transform, opacity;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
    transform-origin: 50% 50%;
    opacity: 0;
  }
  .bottle-cap.show {
    opacity: 1;
    animation: cap-pop 1.8s cubic-bezier(.4, .0, .6, 1) forwards;
  }
  @keyframes cap-pop {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
    8%   { transform: translate(0, 4px) scale(1.05) rotate(-3deg); }      /* anticipation */
    14%  { transform: translate(0, -8px) scale(1.12) rotate(2deg); }       /* pop */
    35%  { transform: translate(40px, -260px) scale(1.05) rotate(420deg); } /* peak arc */
    65%  { transform: translate(120px, -160px) scale(0.95) rotate(900deg); }
    100% { transform: translate(240px, 700px) scale(0.7) rotate(1620deg); opacity: 0; } /* fall off-screen */
  }

  /* Foam burst from bottle neck */
  .foam-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 530;
    overflow: hidden;
  }
  .foam-blob {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffffff 0%, #fbf5d8 40%, rgba(251,245,216,0.4) 70%, rgba(251,245,216,0) 100%);
    will-change: transform, opacity;
    animation: foam-rise 2.4s cubic-bezier(.2,.7,.3,1) forwards;
    filter: blur(0.5px);
    mix-blend-mode: screen;
  }
  @keyframes foam-rise {
    0%   { transform: translate(0,0) scale(0.2); opacity: 0; }
    15%  { transform: translate(var(--fx, 0), -10px) scale(0.6); opacity: 0.95; }
    60%  { transform: translate(calc(var(--fx, 0) * 2), -80px) scale(1.1); opacity: 0.7; }
    100% { transform: translate(calc(var(--fx, 0) * 3), -180px) scale(1.4); opacity: 0; }
  }

  /* Confetti canvas — full screen, drawn over everything */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 600;
  }

  /* Floating emoji burst */
  .emoji-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 550;
    overflow: hidden;
  }
  .emoji-pop {
    position: absolute;
    font-size: 38px;
    animation: float-up 3.6s cubic-bezier(.2,.8,.2,1) forwards;
    will-change: transform, opacity;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
  }
  @keyframes float-up {
    0%   { transform: translateY(0)    rotate(0deg)   scale(0.4); opacity: 0; }
    15%  { transform: translateY(-30px) rotate(8deg)  scale(1.1); opacity: 1; }
    100% { transform: translateY(-90vh) rotate(540deg) scale(0.9); opacity: 0; }
  }

  /* Disco strobe lights */
  body.party::before {
    content: "";
    position: fixed; inset: 0;
    z-index: 400;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 20%, rgba(226,35,26,0.35), transparent 30%),
      radial-gradient(circle at 80% 30%, rgba(0,133,63,0.40), transparent 30%),
      radial-gradient(circle at 50% 80%, rgba(255,215,0,0.30), transparent 30%),
      radial-gradient(circle at 10% 90%, rgba(0,180,255,0.28), transparent 30%);
    animation: disco 1.2s steps(8) infinite;
    mix-blend-mode: screen;
  }
  @keyframes disco {
    0%   { background-position: 0% 0%, 100% 0%, 0% 100%, 100% 100%; filter: hue-rotate(0deg); }
    50%  { background-position: 100% 50%, 0% 50%, 50% 0%, 50% 100%; filter: hue-rotate(120deg); }
    100% { background-position: 0% 0%, 100% 0%, 0% 100%, 100% 100%; filter: hue-rotate(360deg); }
  }

  /* Win card: enhanced bounce-in for party */
  .win-overlay.party .win-card {
    animation: party-pulse 1.6s ease-in-out infinite;
  }
  @keyframes party-pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 0 rgba(226,35,26,0.6); }
    50%      { transform: scale(1.04); box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 24px rgba(226,35,26,0); }
  }

  /* Mobile: stack panels vertically when narrow */
  @media (max-width: 900px) {
    .ctrl-btn { font-size: 11px; padding: 6px 10px; letter-spacing: 0.02em; }
    .ctrl-btn .count { display: inline; }
  }
  @media (max-width: 700px) {
    main { flex-direction: column; }
    .tray, .board { flex: 1 1 50%; }
    .tray { border-right: none; border-bottom: 1px solid rgba(0,0,0,0.2); }
    header {
      height: auto; min-height: 52px; padding: 8px 12px;
      flex-wrap: wrap; gap: 6px;
    }
    .brand { font-size: 16px; }
    .brand .star { width: 18px; height: 18px; }
    .timer { font-size: 14px; padding: 4px 10px; }
    .controls { gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
    .ctrl-btn { font-size: 10px; padding: 5px 8px; }
    main { top: 108px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2 L14.7 9.5 L22.5 9.5 L16.2 14.2 L18.6 21.6 L12 17.1 L5.4 21.6 L7.8 14.2 L1.5 9.5 L9.3 9.5 Z"/>
    </svg>
    <span class="word">Heineken</span>
    <span style="opacity:.6; font-weight:400; font-size:14px; margin-left:6px; letter-spacing:.12em;" id="modeBadge">JIGSAW</span>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="hintBtn" title="Show me where a piece goes">
      💡 HINT <span class="count" id="hintCount">3</span>
    </button>
    <button class="ctrl-btn" id="hardBtn" title="Toggle rotation mode — pieces start at random angles, tap to rotate 90°">
      🔄 HARD
    </button>
    <button class="ctrl-btn" id="dailyBtn" title="Daily challenge — same scramble for everyone today">
      📅 DAILY
    </button>
    <button class="ctrl-btn" id="restartBtn" title="Restart with a fresh scramble">
      ↻ RESTART
    </button>
    <div class="timer" id="timer">00:00</div>
  </div>
</header>

<main>
  <section class="tray" id="tray">
    <div class="tray-stage" id="trayStage"></div>
  </section>
  <section class="board" id="board">
    <div class="board-stage" id="boardStage">
      <div class="target-frame" id="targetFrame"></div>
      <svg class="slot-grid" id="slotGrid"></svg>
    </div>
  </section>
</main>

<svg class="defs-svg" aria-hidden="true">
  <defs id="svgDefs"></defs>
</svg>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="emoji-layer" id="emojiLayer" aria-hidden="true"></div>
<div class="foam-layer" id="foamLayer" aria-hidden="true"></div>

<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2 L14.7 9.5 L22.5 9.5 L16.2 14.2 L18.6 21.6 L12 17.1 L5.4 21.6 L7.8 14.2 L1.5 9.5 L9.3 9.5 Z"/>
    </svg>
    <h1>Solved</h1>
    <p id="winTime">00:00</p>
    <div style="display:flex; gap:8px; justify-content:center; margin-top:18px;">
      <button class="ctrl-btn" id="shareBtn">📤 SHARE</button>
      <button class="ctrl-btn" id="playAgainBtn">▶ PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- Config ----------
  const COLS = 4;
  const ROWS = 5;
  const IMAGE_SRC = 'assets/heineken-bottle.png';
  const SNAP_FRACTION = 0.40;        // snap if pointer within 40% of piece size from correct centre (forgiving)
  const TAB_DEPTH = 0.20;            // fraction of piece edge length
  const PRE_SOLVED_FRACTION = 0.30;  // start with 30% of pieces already placed
  const HINT_COUNT = 3;              // hints allowed per game
  const ROTATE_TAP_PX = 6;           // pointer must move less than this to count as a tap (not drag)
  const ROTATE_TAP_MS = 220;         // and held less than this duration
  let SNAP_THRESHOLD = 28;           // recomputed once pieces are sized

  // ---------- State ----------
  let pieceW = 0, pieceH = 0;
  let boardOriginX = 0, boardOriginY = 0;     // top-left of target frame on board panel
  let trayOriginX = 0, trayOriginY = 0;       // top-left of tray scatter region
  let trayWidth = 0, trayHeight = 0;
  let pieces = [];
  let edgesH = []; // edgesH[r][c] = +1 (tab pointing down into row r+1) or -1
  let edgesV = []; // edgesV[r][c] = +1 (tab pointing right into col c+1) or -1
  let imageEl = null;
  let solvedCount = 0;
  let timerStart = 0;
  let timerHandle = null;
  let timerRunning = false;

  // Mode flags
  let hardMode = false;     // rotation enabled
  let dailyMode = false;    // seeded RNG by date
  let hintsLeft = HINT_COUNT;
  let solveTimeMs = 0;      // final time for share

  // Seeded RNG (mulberry32). When dailyMode is on, all randomness uses this.
  let _seedState = 0;
  function seedRng(seed) { _seedState = (seed >>> 0) || 1; }
  function srand() {
    _seedState |= 0; _seedState = (_seedState + 0x6D2B79F5) | 0;
    let t = Math.imul(_seedState ^ (_seedState >>> 15), 1 | _seedState);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rngRandom() { return dailyMode ? srand() : Math.random(); }
  function dailySeed() {
    const d = new Date();
    // Use NZ local date YYYYMMDD as seed
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return parseInt(`${y}${m}${day}`, 10);
  }
  function dailyLabel() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // ---------- Utilities ----------
  const rand = (min, max) => Math.random() * (max - min) + min;
  const randSign = () => rngRandom() < 0.5 ? -1 : 1;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function fmtTime(ms) {
    const total = Math.floor(ms / 1000);
    const m = String(Math.floor(total / 60)).padStart(2, '0');
    const s = String(total % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  // ---------- Jigsaw path generation ----------
  // Build path for a piece in absolute SVG coords (within its own bounding box).
  // The piece's bounding box = [0, 0, pieceW + 2*depth, pieceH + 2*depth]
  // The piece's body (without tabs) is offset by (depth, depth).
  // edges: { top, right, bottom, left } each is 0 (flat), +1 (tab outward), -1 (tab inward)
  function buildPiecePath(pw, ph, depth, edges) {
    // Inner body corners (where edges actually run between)
    const x0 = depth;
    const y0 = depth;
    const x1 = depth + pw;
    const y1 = depth + ph;

    let d = `M ${x0} ${y0}`;
    d += edgePath(x0, y0, x1, y0, edges.top,    1, 0,  0, -1, pw, depth);  // top: rightward, perp = up
    d += edgePath(x1, y0, x1, y1, edges.right,  0, 1,  1,  0, ph, depth);  // right: downward, perp = right
    d += edgePath(x1, y1, x0, y1, edges.bottom, -1, 0, 0,  1, pw, depth);  // bottom: leftward, perp = down
    d += edgePath(x0, y1, x0, y0, edges.left,   0, -1, -1, 0, ph, depth);  // left: upward, perp = left
    d += ' Z';
    return d;
  }

  // Generate path commands for one edge of length L going from (sx,sy) along (ex,ey)
  // perpendicular outward direction (px, py) (unit vectors)
  // tabFlag: 0 flat, +1 tab in +perp direction, -1 tab in -perp direction
  function edgePath(sx, sy, tx, ty, tabFlag, ex, ey, px, py, L, depth) {
    if (tabFlag === 0) {
      return ` L ${tx} ${ty}`;
    }
    const sign = tabFlag; // +1 = outward, -1 = inward
    const D = depth;      // tab depth in pixels
    // Helper: given (along, perp) in piece-edge-local coords, return absolute (x,y)
    const at = (a, p) => [
      sx + a * ex + p * px * sign,
      sy + a * ey + p * py * sign
    ];

    // Waypoint scheme along the edge (a = distance along edge from sx,sy):
    //   straight to a=0.36L
    //   curve out: control near-base, then up to neck (a=0.34L, p=0.30D)
    //   over the top: bezier knob centred at a=0.5L, p=0.95D
    //   back down to a=0.66L, p=0.30D
    //   curve in to a=0.64L, p=0
    //   straight to end
    const cmds = [];

    // Segment 1: straight along to base of tab
    let p = at(0.36 * L, 0);
    cmds.push(`L ${p[0]} ${p[1]}`);

    // Cubic bezier 1: out and up to neck-left
    let c1 = at(0.34 * L, 0);
    let c2 = at(0.27 * L, 0.30 * D / Math.abs(D) * D);
    let p2 = at(0.34 * L, 0.30 * D);
    cmds.push(`C ${c1[0]} ${c1[1]}, ${c2[0]} ${c2[1]}, ${p2[0]} ${p2[1]}`);

    // Cubic bezier 2: over the top (knob)
    let c3 = at(0.20 * L, 0.95 * D);
    let c4 = at(0.80 * L, 0.95 * D);
    let p3 = at(0.66 * L, 0.30 * D);
    cmds.push(`C ${c3[0]} ${c3[1]}, ${c4[0]} ${c4[1]}, ${p3[0]} ${p3[1]}`);

    // Cubic bezier 3: in and down to base-right
    let c5 = at(0.73 * L, 0.30 * D);
    let c6 = at(0.66 * L, 0);
    let p4 = at(0.64 * L, 0);
    cmds.push(`C ${c5[0]} ${c5[1]}, ${c6[0]} ${c6[1]}, ${p4[0]} ${p4[1]}`);

    // Segment final: straight to end
    cmds.push(`L ${tx} ${ty}`);

    return ' ' + cmds.join(' ');
  }

  // ---------- Build edges grid (interlocking neighbours) ----------
  function buildEdges() {
    edgesH = []; // horizontal edges: between row r and row r+1, for r in [0, ROWS-2]
    edgesV = []; // vertical edges: between col c and col c+1, for c in [0, COLS-2]
    for (let r = 0; r < ROWS - 1; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) row.push(randSign());
      edgesH.push(row);
    }
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS - 1; c++) row.push(randSign());
      edgesV.push(row);
    }
  }

  function pieceEdges(r, c) {
    // edges from piece's perspective:
    // top: 0 if r==0 else if edgesH[r-1][c]==+1 piece (r-1)->piece (r) tab points DOWN, so top of piece (r) is "tab inward" (-1)
    //                    else top of piece (r) is "tab outward" (+1)? Actually:
    // edgesH[r-1][c] sign convention: +1 means tab protrudes from row r-1 INTO row r (so piece (r-1)'s bottom is +1 outward, piece (r)'s top is -1 inward)
    //                                  -1 means tab protrudes from row r INTO row r-1 (piece (r-1)'s bottom is -1 inward, piece (r)'s top is +1 outward)
    let top = 0, right = 0, bottom = 0, left = 0;
    if (r > 0) top = -edgesH[r - 1][c]; // opposite of bottom-of-piece-above
    if (r < ROWS - 1) bottom = edgesH[r][c];
    if (c > 0) left = -edgesV[r][c - 1];
    if (c < COLS - 1) right = edgesV[r][c];
    return { top, right, bottom, left };
  }

  // ---------- Layout ----------
  function computeLayout() {
    const tray = document.getElementById('tray');
    const board = document.getElementById('board');
    const trayRect = tray.getBoundingClientRect();
    const boardRect = board.getBoundingClientRect();

    // Determine piece size that fits within board (with margin)
    const margin = 32;
    const availW = boardRect.width - margin * 2;
    const availH = boardRect.height - margin * 2;
    const cellW = availW / COLS;
    const cellH = availH / ROWS;
    // Pick uniform cell scale that preserves image aspect approximately equal
    // Image is portrait (~2:3). Piece cell aspect should match image cell aspect = 1/COLS : 1/ROWS of image.
    // We'll size piece to fit; image will be scaled to fit grid exactly.
    const cell = Math.min(cellW, cellH * (COLS * 0.8 / ROWS)); // bias slightly so portrait image fits
    pieceW = Math.floor(Math.min(cellW, cellH * 0.66));
    pieceH = Math.floor(pieceW * 1.5); // portrait pieces — image is taller than wide
    // Recompute: if total height exceeds avail, scale down
    if (pieceH * ROWS > availH) {
      pieceH = Math.floor(availH / ROWS);
      pieceW = Math.floor(pieceH / 1.5);
    }
    if (pieceW * COLS > availW) {
      pieceW = Math.floor(availW / COLS);
      pieceH = Math.floor(pieceW * 1.5);
    }

    const totalW = pieceW * COLS;
    const totalH = pieceH * ROWS;
    boardOriginX = Math.floor((boardRect.width - totalW) / 2);
    boardOriginY = Math.floor((boardRect.height - totalH) / 2);

    // Position target frame
    const tabDepth = Math.round(Math.min(pieceW, pieceH) * TAB_DEPTH);
    const frame = document.getElementById('targetFrame');
    frame.style.left = `${boardOriginX}px`;
    frame.style.top = `${boardOriginY}px`;
    frame.style.width = `${totalW}px`;
    frame.style.height = `${totalH}px`;

    // Slot grid SVG (faint lines)
    const slotSvg = document.getElementById('slotGrid');
    slotSvg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);
    slotSvg.style.left = `${boardOriginX}px`;
    slotSvg.style.top = `${boardOriginY}px`;
    slotSvg.style.width = `${totalW}px`;
    slotSvg.style.height = `${totalH}px`;
    slotSvg.innerHTML = '';
    for (let r = 1; r < ROWS; r++) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', 0);
      line.setAttribute('x2', totalW);
      line.setAttribute('y1', r * pieceH);
      line.setAttribute('y2', r * pieceH);
      line.setAttribute('stroke', 'rgba(0,0,0,0.18)');
      line.setAttribute('stroke-width', '1');
      slotSvg.appendChild(line);
    }
    for (let c = 1; c < COLS; c++) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', c * pieceW);
      line.setAttribute('x2', c * pieceW);
      line.setAttribute('y1', 0);
      line.setAttribute('y2', totalH);
      line.setAttribute('stroke', 'rgba(0,0,0,0.18)');
      line.setAttribute('stroke-width', '1');
      slotSvg.appendChild(line);
    }

    // Tray scatter region
    trayOriginX = 16;
    trayOriginY = 16;
    trayWidth = trayRect.width - 32;
    trayHeight = trayRect.height - 32;

    return { tabDepth, totalW, totalH };
  }

  // ---------- Build pieces ----------
  function buildPieces() {
    const trayStage = document.getElementById('trayStage');
    trayStage.innerHTML = '';
    const defs = document.getElementById('svgDefs');
    defs.innerHTML = '';

    const { tabDepth } = computeLayout();
    const totalImgW = pieceW * COLS;
    const totalImgH = pieceH * ROWS;

    // Recompute forgiving snap threshold based on actual piece size
    SNAP_THRESHOLD = Math.round(Math.min(pieceW, pieceH) * SNAP_FRACTION);

    pieces = [];

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const id = `piece-${r}-${c}`;
        const edges = pieceEdges(r, c);

        // Bounding box dims (with overhang for tabs)
        const bbW = pieceW + tabDepth * 2;
        const bbH = pieceH + tabDepth * 2;

        // Build SVG path
        const pathD = buildPiecePath(pieceW, pieceH, tabDepth, edges);

        // Image offset within bounding box (so the bottle image aligns globally)
        // Piece (r,c) shows region of image: x in [c*pieceW, (c+1)*pieceW], y in [r*pieceH, (r+1)*pieceH]
        // In the bounding box, the piece body starts at (tabDepth, tabDepth)
        // So image needs to be drawn at: x = tabDepth - c*pieceW, y = tabDepth - r*pieceH
        const imgX = tabDepth - c * pieceW;
        const imgY = tabDepth - r * pieceH;

        // Each piece is its own SVG with the image and the path as a clip
        const wrapper = document.createElement('div');
        wrapper.className = 'piece';
        wrapper.dataset.r = r;
        wrapper.dataset.c = c;
        wrapper.dataset.id = id;
        wrapper.style.width = `${bbW}px`;
        wrapper.style.height = `${bbH}px`;

        const clipId = `clip-${r}-${c}`;
        const svg = `
          <svg width="${bbW}" height="${bbH}" viewBox="0 0 ${bbW} ${bbH}">
            <defs>
              <clipPath id="${clipId}">
                <path d="${pathD}"/>
              </clipPath>
            </defs>
            <g clip-path="url(#${clipId})">
              <image href="${IMAGE_SRC}" x="${imgX}" y="${imgY}" width="${totalImgW}" height="${totalImgH}" preserveAspectRatio="none"/>
            </g>
            <path d="${pathD}" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
        `;
        wrapper.innerHTML = svg;
        trayStage.appendChild(wrapper);

        // Compute home position: where the piece's bounding box top-left should be
        // when piece is correctly placed on board (in BOARD coordinates).
        // piece body starts at (boardOriginX + c*pieceW, boardOriginY + r*pieceH) on the board panel
        // bounding box top-left = body - (tabDepth, tabDepth)
        const homeX = boardOriginX + c * pieceW - tabDepth;
        const homeY = boardOriginY + r * pieceH - tabDepth;

        // Random scatter position in tray (in tray panel coords)
        const sx = clamp(rngRandom() * (trayWidth - bbW), trayOriginX, trayOriginX + trayWidth - bbW);
        const sy = clamp(rngRandom() * (trayHeight - bbH), trayOriginY, trayOriginY + trayHeight - bbH);

        // Initial rotation: 0 in normal mode; random 90° increment in hard mode
        const rotDeg = hardMode ? (Math.floor(rngRandom() * 4) * 90) : 0;

        const piece = {
          id, r, c, el: wrapper,
          bbW, bbH,
          homeX, homeY,
          x: sx, y: sy,
          rot: rotDeg,        // current rotation in degrees (multiple of 90)
          parent: 'tray',     // 'tray' or 'board'
          locked: false
        };

        if (hardMode) wrapper.classList.add('rotatable');

        positionPiece(piece);
        attachDrag(piece);
        pieces.push(piece);
      }
    }

    prePlaceSome();
  }

  // Pre-solve: lock PRE_SOLVED_FRACTION of pieces at their home positions on the board.
  // Picks pieces randomly so the starting state varies each load.
  function prePlaceSome() {
    const total = pieces.length;
    const n = Math.round(total * PRE_SOLVED_FRACTION);
    if (n <= 0) return;

    const boardStage = document.getElementById('boardStage');
    // Shuffle a copy of indices
    const idx = pieces.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }

    for (let k = 0; k < n; k++) {
      const piece = pieces[idx[k]];
      // Move DOM to board stage
      boardStage.appendChild(piece.el);
      piece.parent = 'board';
      piece.x = piece.homeX;
      piece.y = piece.homeY;
      piece.locked = true;
      piece.el.classList.add('locked');
      positionPiece(piece);
      solvedCount++;
    }
  }

  // Position piece via transform translate (and rotation, in hard mode)
  function positionPiece(piece) {
    if (piece.rot) {
      piece.el.style.transform = `translate(${piece.x}px, ${piece.y}px) rotate(${piece.rot}deg)`;
      piece.el.style.transformOrigin = '50% 50%';
    } else {
      piece.el.style.transform = `translate(${piece.x}px, ${piece.y}px)`;
    }
  }

  // Move a piece between tray and board DOM (preserving visual position)
  function reparent(piece, target) {
    if (piece.parent === target) return;
    const trayRect = document.getElementById('tray').getBoundingClientRect();
    const boardRect = document.getElementById('board').getBoundingClientRect();
    if (piece.parent === 'tray' && target === 'board') {
      // Convert tray-local coords to board-local coords
      const absX = trayRect.left + piece.x;
      const absY = trayRect.top + piece.y;
      piece.x = absX - boardRect.left;
      piece.y = absY - boardRect.top;
      document.getElementById('boardStage').appendChild(piece.el);
    } else if (piece.parent === 'board' && target === 'tray') {
      const absX = boardRect.left + piece.x;
      const absY = boardRect.top + piece.y;
      piece.x = absX - trayRect.left;
      piece.y = absY - trayRect.top;
      document.getElementById('trayStage').appendChild(piece.el);
    }
    piece.parent = target;
    positionPiece(piece);
  }

  // ---------- Drag handling ----------
  function attachDrag(piece) {
    const el = piece.el;
    let active = false;
    let pointerId = null;
    let startPointerX = 0, startPointerY = 0;
    let startPieceX = 0, startPieceY = 0;
    let downTime = 0;
    let moved = false;

    el.addEventListener('pointerdown', onDown);

    function onDown(e) {
      if (piece.locked) return;
      e.preventDefault();
      active = true;
      moved = false;
      downTime = performance.now();
      pointerId = e.pointerId;
      el.setPointerCapture(pointerId);
      el.classList.add('dragging');
      el.classList.remove('snap-anim', 'return-anim');

      // Bring piece to front by re-appending in current parent
      el.parentNode.appendChild(el);

      // Get piece's current absolute position (page coords)
      const rect = el.getBoundingClientRect();
      // Move piece into top-level "drag layer" — body — to escape panel clipping
      moveToDragLayer(piece, rect.left, rect.top);

      startPointerX = e.clientX;
      startPointerY = e.clientY;
      startPieceX = piece.x;
      startPieceY = piece.y;

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);

      ensureTimerRunning();
    }

    function onMove(e) {
      if (!active) return;
      const dx = e.clientX - startPointerX;
      const dy = e.clientY - startPointerY;
      if (!moved && Math.hypot(dx, dy) > ROTATE_TAP_PX) moved = true;
      piece.x = startPieceX + dx;
      piece.y = startPieceY + dy;
      positionPiece(piece);
    }

    function onUp(e) {
      if (!active) return;
      active = false;
      try { el.releasePointerCapture(pointerId); } catch (_) {}
      el.classList.remove('dragging');
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);

      const elapsed = performance.now() - downTime;

      // Hard mode: tap without drag → rotate 90° in place
      if (hardMode && !moved && elapsed < ROTATE_TAP_MS) {
        const trayRect = document.getElementById('tray').getBoundingClientRect();
        const boardRect = document.getElementById('board').getBoundingClientRect();
        const overBoard = e.clientX >= boardRect.left && e.clientX <= boardRect.right &&
                          e.clientY >= boardRect.top && e.clientY <= boardRect.bottom;
        const target = overBoard ? 'board' : 'tray';
        // Convert piece.x/y from page (drag layer) back into target panel coords.
        // reparentFromDragLayer does that conversion.
        reparentFromDragLayer(piece, target);
        piece.rot = (piece.rot + 90) % 360;
        const panelRect = (target === 'board' ? boardRect : trayRect);
        piece.x = clamp(piece.x, 4, panelRect.width - piece.bbW - 4);
        piece.y = clamp(piece.y, 4, panelRect.height - piece.bbH - 4);
        positionPiece(piece);
        if (navigator.vibrate) navigator.vibrate(12);
        return;
      }

      // Normal drop logic
      const boardRect = document.getElementById('board').getBoundingClientRect();
      const trayRect = document.getElementById('tray').getBoundingClientRect();
      const homePageX = boardRect.left + piece.homeX;
      const homePageY = boardRect.top + piece.homeY;

      const pieceCentreX = piece.x + piece.bbW / 2;
      const pieceCentreY = piece.y + piece.bbH / 2;
      const homeCentreX = homePageX + piece.bbW / 2;
      const homeCentreY = homePageY + piece.bbH / 2;
      const dist = Math.hypot(pieceCentreX - homeCentreX, pieceCentreY - homeCentreY);

      // Snap requires both position close AND rotation correct (0°)
      const rotCorrect = (piece.rot % 360) === 0;

      if (dist <= SNAP_THRESHOLD && rotCorrect) {
        // Snap to home
        el.classList.add('snap-anim');
        piece.x = homePageX;
        piece.y = homePageY;
        positionPiece(piece);
        setTimeout(() => {
          reparentFromDragLayer(piece, 'board');
          piece.locked = true;
          el.classList.remove('snap-anim');
          el.classList.add('locked');
          solvedCount++;
          spawnSnapGlow(homePageX, homePageY, piece.bbW, piece.bbH);
          if (navigator.vibrate) navigator.vibrate(30);
          checkWin();
        }, 200);
      } else {
        const ux = e.clientX, uy = e.clientY;
        const overBoard = ux >= boardRect.left && ux <= boardRect.right && uy >= boardRect.top && uy <= boardRect.bottom;
        const target = overBoard ? 'board' : 'tray';

        reparentFromDragLayer(piece, target);
        const panelRect = (target === 'board' ? boardRect : trayRect);
        piece.x = clamp(piece.x, 4, panelRect.width - piece.bbW - 4);
        piece.y = clamp(piece.y, 4, panelRect.height - piece.bbH - 4);
        el.classList.add('return-anim');
        positionPiece(piece);
        setTimeout(() => el.classList.remove('return-anim'), 360);
      }
    }
  }

  // Green snap flash at the lock position (page coords)
  function spawnSnapGlow(pageX, pageY, w, h) {
    const glow = document.createElement('div');
    glow.className = 'snap-glow';
    glow.style.left = `${pageX}px`;
    glow.style.top = `${pageY}px`;
    glow.style.width = `${w}px`;
    glow.style.height = `${h}px`;
    document.body.appendChild(glow);
    setTimeout(() => glow.remove(), 700);
  }

  // Move piece into <body> drag layer so it's not clipped by panel overflow
  function moveToDragLayer(piece, pageX, pageY) {
    if (piece.parent === 'drag') return;
    document.body.appendChild(piece.el);
    piece.parent = 'drag';
    piece.x = pageX;
    piece.y = pageY;
    positionPiece(piece);
  }

  function reparentFromDragLayer(piece, target) {
    const stage = document.getElementById(target === 'board' ? 'boardStage' : 'trayStage');
    const stageRect = stage.getBoundingClientRect();
    // Convert page coords to stage-local
    piece.x = piece.x - stageRect.left;
    piece.y = piece.y - stageRect.top;
    stage.appendChild(piece.el);
    piece.parent = target;
    positionPiece(piece);
  }

  // ---------- Timer ----------
  function ensureTimerRunning() {
    if (timerRunning) return;
    timerRunning = true;
    timerStart = performance.now();
    timerHandle = setInterval(() => {
      const elapsed = performance.now() - timerStart;
      document.getElementById('timer').textContent = fmtTime(elapsed);
    }, 250);
  }
  function stopTimer() {
    if (!timerRunning) return;
    timerRunning = false;
    clearInterval(timerHandle);
  }

  // ---------- Win ----------
  function checkWin() {
    if (solvedCount === ROWS * COLS) {
      stopTimer();
      solveTimeMs = performance.now() - timerStart;
      const finalText = document.getElementById('timer').textContent;
      let label = `Solved in ${finalText}`;
      if (dailyMode) label += ` · Daily ${dailyLabel()}`;
      if (hardMode) label += ' · Hard';
      document.getElementById('winTime').textContent = label;
      // 1. Beat for last snap settle
      // 2. Bottle opens (cap flies off, foam spurts)
      // 3. Confetti + emoji + fanfare
      setTimeout(openBottle, 300);
      setTimeout(startParty, 1100);
    }
  }

  // ---------- Bottle open animation ----------
  function openBottle() {
    const board = document.getElementById('board');
    const boardRect = board.getBoundingClientRect();

    // Cap geometry — derived from board target frame
    const frameW = pieceW * COLS;
    const frameH = pieceH * ROWS;
    const frameLeft = boardRect.left + boardOriginX;
    const frameTop = boardRect.top + boardOriginY;

    // Bottle cap position on bottle image (empirical for the Heineken bottle PNG)
    // Cap centre ≈ horizontal middle, ~5.5% from top of image. Cap radius ≈ 8.5% of image width.
    const capCx = frameLeft + frameW * 0.5;
    const capCy = frameTop + frameH * 0.055;
    const capR = frameW * 0.085;
    const capSize = capR * 2;

    // Build SVG cap with serrated edge + Heineken-style star
    const serrations = 24;
    const innerR = 40;
    const outerR = 47;
    let serrPath = '';
    for (let i = 0; i < serrations; i++) {
      const a1 = (i / serrations) * Math.PI * 2;
      const a2 = ((i + 0.5) / serrations) * Math.PI * 2;
      const x1 = Math.cos(a1) * outerR;
      const y1 = Math.sin(a1) * outerR;
      const x2 = Math.cos(a2) * innerR;
      const y2 = Math.sin(a2) * innerR;
      serrPath += `${i === 0 ? 'M' : 'L'} ${x1.toFixed(2)} ${y1.toFixed(2)} L ${x2.toFixed(2)} ${y2.toFixed(2)} `;
    }
    serrPath += 'Z';

    const capSVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100" width="${capSize}" height="${capSize}">
        <defs>
          <radialGradient id="capGrad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ff5b50"/>
            <stop offset="60%" stop-color="#e2231a"/>
            <stop offset="100%" stop-color="#8a0d07"/>
          </radialGradient>
        </defs>
        <path d="${serrPath}" fill="url(#capGrad)" stroke="rgba(0,0,0,0.4)" stroke-width="0.8"/>
        <circle r="36" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
        <circle r="30" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.6"/>
        <!-- Heineken white star -->
        <polygon points="0,-18 5.3,-5.6 18,-5.6 7.3,3.5 11.1,16.6 0,8.7 -11.1,16.6 -7.3,3.5 -18,-5.6 -5.3,-5.6" fill="white" opacity="0.95"/>
        <!-- highlight glint -->
        <ellipse cx="-15" cy="-22" rx="11" ry="6" fill="white" opacity="0.35" transform="rotate(-25)"/>
      </svg>
    `;

    const cap = document.createElement('div');
    cap.className = 'bottle-cap';
    cap.style.left = `${capCx - capR}px`;
    cap.style.top = `${capCy - capR}px`;
    cap.style.width = `${capSize}px`;
    cap.style.height = `${capSize}px`;
    cap.innerHTML = capSVG;
    document.body.appendChild(cap);

    // Trigger animation next frame so opacity transition kicks in cleanly
    requestAnimationFrame(() => cap.classList.add('show'));

    playPop();

    // Foam bursts from the neck slightly after cap clears (around 250ms)
    setTimeout(() => spawnFoam(capCx, capCy + capR * 0.8), 220);
    setTimeout(() => spawnFoam(capCx, capCy + capR * 1.2), 420);
    setTimeout(() => spawnFoam(capCx, capCy + capR * 1.5), 620);

    // Cleanup cap after animation
    setTimeout(() => cap.remove(), 2000);
  }

  function spawnFoam(centerX, centerY) {
    const layer = document.getElementById('foamLayer');
    const count = 14;
    for (let i = 0; i < count; i++) {
      const blob = document.createElement('div');
      blob.className = 'foam-blob';
      const size = 18 + Math.random() * 32;
      const offsetX = (Math.random() - 0.5) * 40;
      const drift = (Math.random() - 0.5) * 80;
      blob.style.width = `${size}px`;
      blob.style.height = `${size}px`;
      blob.style.left = `${centerX - size / 2 + offsetX}px`;
      blob.style.top = `${centerY - size / 2}px`;
      blob.style.setProperty('--fx', `${drift}px`);
      blob.style.animationDelay = `${Math.random() * 0.12}s`;
      layer.appendChild(blob);
      setTimeout(() => blob.remove(), 2700);
    }
  }

  // POP sound: short noise burst + low-frequency thump
  function playPop() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const now = ctx.currentTime;

      // Thump: low sine drop
      const osc = ctx.createOscillator();
      const oscGain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
      oscGain.gain.setValueAtTime(0, now);
      oscGain.gain.linearRampToValueAtTime(0.35, now + 0.005);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.connect(oscGain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.2);

      // Noise burst for the "psssh" carbonation
      const bufferSize = ctx.sampleRate * 0.25;
      const noiseBuf = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.6;
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuf;
      const noiseGain = ctx.createGain();
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 1200;
      noiseGain.gain.setValueAtTime(0.0001, now);
      noiseGain.gain.linearRampToValueAtTime(0.15, now + 0.02);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
      noise.connect(hp).connect(noiseGain).connect(ctx.destination);
      noise.start(now);
      noise.stop(now + 0.26);

      setTimeout(() => { try { ctx.close(); } catch(_){} }, 800);
    } catch (_) { /* silent */ }
  }

  // ---------- Party time ----------
  function startParty() {
    const overlay = document.getElementById('winOverlay');
    document.body.classList.add('party');
    overlay.classList.add('visible', 'party');

    fireConfetti();
    spawnEmojiBursts();
    playFanfare();

    // Wire share + play-again buttons (re-wire each win in case overlay was dismissed)
    const shareBtn = document.getElementById('shareBtn');
    const playAgainBtn = document.getElementById('playAgainBtn');
    const newShare = shareBtn.cloneNode(true);
    const newPlay = playAgainBtn.cloneNode(true);
    shareBtn.parentNode.replaceChild(newShare, shareBtn);
    playAgainBtn.parentNode.replaceChild(newPlay, playAgainBtn);
    newShare.addEventListener('click', (e) => { e.stopPropagation(); shareResult(); });
    newPlay.addEventListener('click', (e) => { e.stopPropagation(); restartGame(); });

    // Click overlay (outside card) to dismiss party
    overlay.addEventListener('click', (e) => {
      if (e.target.closest('.win-card')) return; // ignore card clicks
      overlay.classList.remove('visible', 'party');
      document.body.classList.remove('party');
      stopConfetti();
    });
  }

  // -- Confetti --
  let confettiRAF = null;
  let confettiParticles = [];
  let confettiCtx = null;

  function fireConfetti() {
    const canvas = document.getElementById('confetti');
    const dpr = window.devicePixelRatio || 1;
    const resize = () => {
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    };
    resize();
    window.addEventListener('resize', resize);
    confettiCtx = canvas.getContext('2d');
    confettiCtx.scale(dpr, dpr);

    const colors = ['#e2231a', '#00853f', '#ffd700', '#ffffff', '#00b4ff', '#ff7b00'];

    // Two cannons firing from bottom-left and bottom-right
    const W = window.innerWidth;
    const H = window.innerHeight;

    confettiParticles = [];
    const burst = (originX, originY, vxBias) => {
      for (let i = 0; i < 140; i++) {
        const angle = (-Math.PI / 2) + (Math.random() - 0.5) * 0.9 + vxBias;
        const speed = 8 + Math.random() * 12;
        confettiParticles.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.4,
          w: 6 + Math.random() * 6,
          h: 10 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 0,
          maxLife: 220 + Math.random() * 80
        });
      }
    };

    burst(W * 0.10, H * 0.95, 0.5);
    burst(W * 0.90, H * 0.95, -0.5);
    // After short delay, two more bursts from top corners falling down
    setTimeout(() => {
      const cannon = (x, vxBias) => {
        for (let i = 0; i < 90; i++) {
          confettiParticles.push({
            x, y: -10,
            vx: vxBias + (Math.random() - 0.5) * 4,
            vy: 2 + Math.random() * 3,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.3,
            w: 6 + Math.random() * 6,
            h: 10 + Math.random() * 8,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 0,
            maxLife: 280 + Math.random() * 100
          });
        }
      };
      cannon(W * 0.25, 1);
      cannon(W * 0.75, -1);
    }, 600);

    cancelAnimationFrame(confettiRAF);
    const tick = () => {
      const ctx = confettiCtx;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const gravity = 0.28;
      const drag = 0.992;
      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.life++;
        p.vy += gravity;
        p.vx *= drag;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vrot;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        const fade = Math.max(0, 1 - p.life / p.maxLife);
        ctx.globalAlpha = fade;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();

        if (p.life > p.maxLife || p.y > window.innerHeight + 40) {
          confettiParticles.splice(i, 1);
        }
      }
      if (confettiParticles.length > 0) {
        confettiRAF = requestAnimationFrame(tick);
      } else {
        cancelAnimationFrame(confettiRAF);
        confettiRAF = null;
      }
    };
    confettiRAF = requestAnimationFrame(tick);
  }

  function stopConfetti() {
    confettiParticles = [];
    if (confettiCtx) {
      const c = document.getElementById('confetti');
      confettiCtx.clearRect(0, 0, c.width, c.height);
    }
  }

  // -- Emoji bursts --
  function spawnEmojiBursts() {
    const layer = document.getElementById('emojiLayer');
    layer.innerHTML = '';
    const emojis = ['🎉', '🍻', '⭐', '🍺', '✨', '🎊', '🥳'];
    const total = 28;
    for (let i = 0; i < total; i++) {
      setTimeout(() => {
        const span = document.createElement('span');
        span.className = 'emoji-pop';
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        const left = 5 + Math.random() * 90;
        span.style.left = `${left}vw`;
        span.style.bottom = `-40px`;
        span.style.fontSize = `${28 + Math.random() * 28}px`;
        layer.appendChild(span);
        setTimeout(() => span.remove(), 3700);
      }, i * 90);
    }
  }

  // -- Fanfare (simple Web Audio chord ascending) --
  function playFanfare() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const now = ctx.currentTime;
      // C major chord rising arpeggio + chord
      const notes = [
        { f: 523.25, t: 0.00, d: 0.18 }, // C5
        { f: 659.25, t: 0.10, d: 0.18 }, // E5
        { f: 783.99, t: 0.20, d: 0.20 }, // G5
        { f: 1046.5, t: 0.30, d: 0.50 }, // C6
        // chord stack
        { f: 523.25, t: 0.50, d: 0.80 },
        { f: 659.25, t: 0.50, d: 0.80 },
        { f: 783.99, t: 0.50, d: 0.80 }
      ];
      notes.forEach(n => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = n.f;
        gain.gain.setValueAtTime(0, now + n.t);
        gain.gain.linearRampToValueAtTime(0.18, now + n.t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.d);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now + n.t);
        osc.stop(now + n.t + n.d + 0.05);
      });
      // Auto-close context after fanfare
      setTimeout(() => { try { ctx.close(); } catch(_){} }, 2500);
    } catch (_) { /* silent */ }
  }

  // ---------- Image preload ----------
  function preloadImage() {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = (e) => reject(new Error(`Failed to load ${IMAGE_SRC}`));
      img.src = IMAGE_SRC;
      imageEl = img;
    });
  }

  // ---------- Init ----------
  async function init() {
    try {
      await preloadImage();
    } catch (err) {
      const msg = document.createElement('div');
      msg.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0d0c;color:#fff;font-family:sans-serif;text-align:center;padding:24px;';
      msg.innerHTML = `<div><h2 style="color:#e2231a">Image not found</h2><p>Place <code>${IMAGE_SRC}</code> next to <code>index.html</code> and reload.</p></div>`;
      document.body.appendChild(msg);
      return;
    }
    wireControls();
    updateHintBtn();
    buildEdges();
    buildPieces();
  }

  // Rebuild on resize (debounced)
  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      // Only rebuild if not in middle of solving — destructive, so just on initial sizing
      // For simplicity we skip live resize re-layout once pieces exist.
    }, 200);
  });

  // ---------- Restart ----------
  function restartGame(opts = {}) {
    // Tear down DOM
    document.getElementById('trayStage').innerHTML = '';
    document.getElementById('boardStage').querySelectorAll('.piece').forEach(p => p.remove());
    // Cancel ongoing animations
    document.querySelectorAll('.bottle-cap, .foam-blob, .snap-glow, .hint-pulse, .emoji-pop').forEach(n => n.remove());
    stopConfetti();
    document.body.classList.remove('party');
    document.getElementById('winOverlay').classList.remove('visible', 'party');

    // Reset state
    pieces = [];
    solvedCount = 0;
    hintsLeft = HINT_COUNT;
    updateHintBtn();
    solveTimeMs = 0;

    // Reset timer
    if (timerRunning) clearInterval(timerHandle);
    timerRunning = false;
    timerStart = 0;
    document.getElementById('timer').textContent = '00:00';

    // Apply mode flags from opts (or current)
    if ('hard' in opts) hardMode = opts.hard;
    if ('daily' in opts) dailyMode = opts.daily;

    // Re-seed if daily
    if (dailyMode) seedRng(dailySeed());

    // Mode badge text
    const badge = document.getElementById('modeBadge');
    const labels = [];
    if (dailyMode) labels.push(`DAILY ${dailyLabel()}`);
    if (hardMode) labels.push('HARD');
    badge.textContent = labels.length ? labels.join(' · ') : 'JIGSAW';

    // Active states
    document.getElementById('hardBtn').classList.toggle('active', hardMode);
    document.getElementById('dailyBtn').classList.toggle('active', dailyMode);

    // Rebuild
    buildEdges();
    buildPieces();
  }

  // ---------- Hint ----------
  function requestHint() {
    if (hintsLeft <= 0) return;
    const unplaced = pieces.filter(p => !p.locked);
    if (unplaced.length === 0) return;
    const target = unplaced[Math.floor(rngRandom() * unplaced.length)];
    flashSlot(target);
    hintsLeft--;
    updateHintBtn();
  }
  function updateHintBtn() {
    const btn = document.getElementById('hintBtn');
    document.getElementById('hintCount').textContent = hintsLeft;
    btn.disabled = hintsLeft <= 0;
  }
  function flashSlot(piece) {
    // Place pulse rect inside boardStage at piece.homeX/homeY relative to stage
    const stage = document.getElementById('boardStage');
    const pulse = document.createElement('div');
    pulse.className = 'hint-pulse';
    pulse.style.left = `${piece.homeX}px`;
    pulse.style.top = `${piece.homeY}px`;
    pulse.style.width = `${piece.bbW}px`;
    pulse.style.height = `${piece.bbH}px`;
    stage.appendChild(pulse);
    setTimeout(() => pulse.remove(), 2300);
  }

  // ---------- Share ----------
  function buildShareText() {
    const url = location.origin + location.pathname;
    const time = document.getElementById('timer').textContent;
    let prefix = 'Heineken Jigsaw';
    if (dailyMode) prefix += ` Daily ${dailyLabel()}`;
    if (hardMode) prefix += ' (Hard)';
    return `${prefix} — solved in ${time} 🍻\n${url}`;
  }
  async function shareResult() {
    const text = buildShareText();
    try {
      if (navigator.share) {
        await navigator.share({ title: 'Heineken Jigsaw', text });
        return;
      }
    } catch (_) { /* user cancelled or unsupported */ }
    try {
      await navigator.clipboard.writeText(text);
      showToast('Copied to clipboard');
    } catch (_) {
      // Fallback: prompt
      window.prompt('Copy this:', text);
    }
  }
  function showToast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- Controls wiring ----------
  function wireControls() {
    document.getElementById('restartBtn').addEventListener('click', () => restartGame());
    document.getElementById('hintBtn').addEventListener('click', requestHint);
    document.getElementById('hardBtn').addEventListener('click', () => restartGame({ hard: !hardMode }));
    document.getElementById('dailyBtn').addEventListener('click', () => restartGame({ daily: !dailyMode }));
  }

  // Dev shortcut: press "W" to auto-solve (preview party).
  // Press "C" to fire confetti standalone without affecting puzzle state.
  window.addEventListener('keydown', (e) => {
    if (e.key === 'w' || e.key === 'W') {
      pieces.forEach(p => {
        if (p.locked) return;
        document.getElementById('boardStage').appendChild(p.el);
        p.parent = 'board';
        p.x = p.homeX;
        p.y = p.homeY;
        p.rot = 0;
        p.locked = true;
        p.el.classList.add('locked');
        positionPiece(p);
        solvedCount++;
      });
      checkWin(); // triggers bottle-open + party via standard sequence
    } else if (e.key === 'c' || e.key === 'C') {
      fireConfetti();
      spawnEmojiBursts();
      playFanfare();
    }
  });

  // Boot
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
