<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Heineken Jigsaw Puzzle</title>
<style>
  :root {
    --hk-green: #00853f;
    --hk-green-dark: #00622e;
    --hk-red: #e2231a;
    --bg: #0b0d0c;
    --bg-soft: #14181a;
    --tray-bg: #f6f3eb;
    --board-bg: #00853f;
    --board-shadow: rgba(0,0,0,0.45);
    --piece-shadow: 0 6px 14px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.55);
    --piece-shadow-lift: 0 18px 32px rgba(0,0,0,0.55), 0 4px 10px rgba(0,0,0,0.6);
    --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: radial-gradient(ellipse at top, #1a1f1c 0%, var(--bg) 60%, #050706 100%);
    color: #fff;
    font-family: var(--font);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0));
    z-index: 100;
    pointer-events: none;
    gap: 12px;
  }

  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; letter-spacing: 0.04em;
    font-size: 22px;
  }
  .brand .star {
    width: 22px; height: 22px;
    color: var(--hk-red);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
  }
  .brand .word { font-style: italic; font-family: 'Georgia', serif; }

  .timer {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.06em;
    padding: 6px 14px;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .controls {
    display: flex; gap: 8px; align-items: center;
    pointer-events: auto;
  }
  .ctrl-btn {
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.18);
    color: white;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    font: 600 13px var(--font);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background 160ms ease, border-color 160ms ease, transform 80ms ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .ctrl-btn:hover { background: rgba(0,0,0,0.7); border-color: rgba(255,255,255,0.35); }
  .ctrl-btn:active { transform: scale(0.94); }
  .ctrl-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
  .ctrl-btn.active { background: var(--hk-red); border-color: var(--hk-red); }
  .ctrl-btn .count { opacity: 0.75; font-weight: 400; }

  /* Snap success glow */
  .snap-glow {
    position: fixed;
    border: 3px solid #5cffb1;
    border-radius: 6px;
    box-shadow: 0 0 28px 6px rgba(92,255,177,0.65), inset 0 0 14px rgba(92,255,177,0.4);
    pointer-events: none;
    z-index: 450;
    animation: snap-glow 650ms ease-out forwards;
  }
  @keyframes snap-glow {
    0%   { opacity: 0; transform: scale(0.85); }
    25%  { opacity: 1; transform: scale(1.12); }
    100% { opacity: 0; transform: scale(1.02); }
  }

  /* Hint slot pulse */
  .hint-pulse {
    position: absolute;
    border: 3px dashed #ffd700;
    border-radius: 6px;
    box-shadow: 0 0 30px 8px rgba(255,215,0,0.6), inset 0 0 18px rgba(255,215,0,0.45);
    pointer-events: none;
    z-index: 80;
    animation: hint-pulse 2200ms ease-out forwards;
    background: rgba(255,215,0,0.10);
  }
  @keyframes hint-pulse {
    0%   { opacity: 0; transform: scale(0.9); }
    18%  { opacity: 1; transform: scale(1.08); }
    50%  { opacity: 0.8; transform: scale(1.02); }
    100% { opacity: 0; transform: scale(1.04); }
  }

  /* Toast (share confirmation) */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    font: 600 14px var(--font);
    letter-spacing: 0.04em;
    z-index: 800;
    opacity: 0;
    transition: opacity 240ms ease, transform 240ms ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Piece rotation handle indicator on hover (hard mode) */
  .piece.rotatable:not(.locked):not(.dragging):hover {
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45)) drop-shadow(0 0 8px rgba(255,215,0,0.5));
  }

  main {
    position: absolute;
    top: 64px; bottom: 0; left: 0; right: 0;
    display: flex;
  }

  .tray, .board {
    position: relative;
    flex: 1 1 50%;
    overflow: hidden;
  }
  .tray {
    background:
      radial-gradient(ellipse at 30% 20%, #007a3a 0%, #00622e 50%, #002b14 100%);
    border-right: 1px solid rgba(0,0,0,0.4);
    color: #fff;
  }

  /* Leaderboard sidebar pinned to the tray (left panel) */
  .lb-sidebar {
    position: absolute; inset: 0;
    z-index: 1;
    pointer-events: none;   /* clicks pass through to puzzle pieces */
    padding: 22px;
    display: flex; flex-direction: column;
    color: rgba(255,255,255,0.96);
    font-family: var(--font);
    background: linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.0));
  }
  .lb-sidebar-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 4px;
  }
  .lb-sidebar-header svg.star {
    width: 22px; height: 22px; color: var(--hk-red);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
  }
  .lb-sidebar-title {
    font-family: 'Georgia', serif; font-style: italic;
    font-size: 22px; letter-spacing: 0.02em;
  }
  .lb-sidebar-sub {
    font-size: 10px; letter-spacing: 0.20em; text-transform: uppercase;
    opacity: 0.55; margin-bottom: 10px;
  }
  .lb-sidebar-list {
    list-style: none; margin: 0; padding: 0;
    flex: 1; overflow-y: auto;
    border-top: 1px solid rgba(255,255,255,0.10);
    pointer-events: auto;
  }
  .lb-sidebar-list::-webkit-scrollbar { width: 5px; }
  .lb-sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }
  .lb-sidebar-list li {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 8px 6px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 13px; letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .lb-sidebar-list li:last-child { border-bottom: none; }
  .lb-sidebar-list li.me {
    background: linear-gradient(90deg, rgba(226,35,26,0.32), rgba(226,35,26,0));
    border-left: 3px solid var(--hk-red);
    padding-left: 3px;
  }
  .lb-sidebar-list .rank { font-weight: 700; opacity: 0.55; text-align: center; }
  .lb-sidebar-list li.gold .rank   { color: #ffd700; opacity: 1; text-shadow: 0 0 8px rgba(255,215,0,0.7); }
  .lb-sidebar-list li.silver .rank { color: #d8d8d8; opacity: 1; }
  .lb-sidebar-list li.bronze .rank { color: #cd7f32; opacity: 1; }
  .lb-sidebar-list .name { font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-sidebar-list .time { opacity: 0.85; font-weight: 600; }
  .lb-sidebar-list .mode-pill {
    display: inline-block;
    font-size: 8px; opacity: 0.55; text-transform: uppercase;
    margin-left: 5px; padding: 1px 5px;
    border-radius: 999px; background: rgba(255,255,255,0.10);
    letter-spacing: 0.10em; font-weight: 600;
    vertical-align: middle;
  }
  .lb-sidebar-footer {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 10px; letter-spacing: 0.16em;
    opacity: 0.45; text-transform: uppercase; text-align: center;
  }
  /* On narrow mobile, sidebar tucks above the tray pieces, keeps small */
  @media (max-width: 700px) {
    .lb-sidebar { padding: 12px; }
    .lb-sidebar-title { font-size: 16px; }
    .lb-sidebar-list li { font-size: 11px; padding: 5px 4px; }
    .lb-sidebar-list .mode-pill { display: none; }
  }
  .board {
    background:
      radial-gradient(ellipse at 50% 30%, #00a14e 0%, var(--hk-green) 50%, var(--hk-green-dark) 100%);
  }

  /* container that holds the board grid centred */
  .board-stage, .tray-stage {
    position: absolute;
    inset: 0;
  }

  /* board target outline */
  .target-frame {
    position: absolute;
    border: 2px solid rgba(0,0,0,0.35);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 25px 50px -12px var(--board-shadow);
    background: rgba(0,0,0,0.18);
    border-radius: 4px;
    pointer-events: none;
  }
  .slot-grid {
    position: absolute;
    pointer-events: none;
    /* faint outlines drawn via SVG inside */
  }

  /* SVG defs container - hidden visually */
  .defs-svg { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* Each piece is an absolutely positioned div containing an SVG */
  .piece {
    position: absolute;
    cursor: grab;
    will-change: transform;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45));
    transition: filter 160ms ease;
    touch-action: none;
  }
  .piece.dragging {
    cursor: grabbing;
    filter: drop-shadow(0 16px 24px rgba(0,0,0,0.6));
    z-index: 1000;
  }
  .piece.locked {
    cursor: default;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    pointer-events: none;
    transition: filter 240ms ease;
  }
  .piece.snap-anim {
    transition: transform 180ms cubic-bezier(.2,.8,.2,1);
  }
  .piece.return-anim {
    transition: transform 320ms cubic-bezier(.34,1.56,.64,1);
  }

  /* idle wobble for tray pieces */
  @keyframes wobble {
    0%, 100% { transform: translate(var(--tx,0), var(--ty,0)) rotate(var(--rot,0deg)); }
    50% { transform: translate(var(--tx,0), calc(var(--ty,0) - 1.5px)) rotate(calc(var(--rot,0deg) + 0.4deg)); }
  }

  .piece svg { display: block; overflow: visible; }

  /* Dim backdrop (below confetti) */
  .win-dim {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.30), rgba(0,0,0,0.70));
    opacity: 0;
    pointer-events: none;
    transition: opacity 600ms ease;
    z-index: 400;
  }
  .win-dim.visible { opacity: 1; }

  /* Win card container (above confetti) */
  .win-overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 600ms ease;
    z-index: 700;     /* above confetti so the card sits on top */
  }
  .win-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .win-card {
    text-align: center;
    padding: 30px 36px;
    min-width: 360px;
    max-width: 92vw;
    background: linear-gradient(160deg, rgba(0,40,18,0.95), rgba(0,15,8,0.92));
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
    transform: translateY(20px) scale(0.95);
    transition: transform 600ms cubic-bezier(.2,.8,.2,1);
  }
  .win-overlay.visible .win-card { transform: translateY(0) scale(1); }
  .win-card .star {
    width: 44px; height: 44px; color: var(--hk-red);
    margin-bottom: 4px;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  .win-card h1 {
    margin: 0 0 6px; font-size: 30px; letter-spacing: 0.04em;
    font-family: 'Georgia', serif; font-style: italic;
  }
  .win-card .time-line {
    margin: 4px 0 0; font-size: 18px; color: rgba(255,255,255,0.85);
    font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .win-card .mode-line {
    margin: 4px 0 0; font-size: 11px; color: rgba(255,255,255,0.55);
    letter-spacing: 0.16em; text-transform: uppercase;
  }
  .win-card .name-prompt {
    margin: 18px 0 6px; font-size: 12px; color: rgba(255,255,255,0.70);
    letter-spacing: 0.16em; text-transform: uppercase;
  }
  .name-input {
    background: rgba(0,0,0,0.55);
    border: 2px solid var(--hk-red);
    color: #fff;
    padding: 12px 16px;
    font-size: 18px;
    letter-spacing: 0.10em;
    text-align: center;
    text-transform: uppercase;
    border-radius: 8px;
    width: 240px;
    margin: 8px 0 4px;
    outline: none;
    font-family: var(--font);
    font-weight: 700;
    box-sizing: border-box;
  }
  .name-input:focus {
    box-shadow: 0 0 0 4px rgba(226,35,26,0.35);
    border-color: #ff6b60;
  }
  .win-actions {
    display: flex; gap: 8px; justify-content: center; margin-top: 16px;
    flex-wrap: wrap;
  }
  .win-actions .primary {
    background: var(--hk-red);
    border-color: var(--hk-red);
  }
  .win-actions .primary:hover { background: #ff3a30; }

  /* Leaderboard list */
  .lb {
    list-style: none; padding: 0; margin: 16px 0 0;
    max-height: 320px; overflow-y: auto;
    text-align: left;
    border-top: 1px solid rgba(255,255,255,0.10);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .lb::-webkit-scrollbar { width: 6px; }
  .lb::-webkit-scrollbar-track { background: transparent; }
  .lb::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  .lb li {
    display: grid;
    grid-template-columns: 30px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 13px;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .lb li:last-child { border-bottom: none; }
  .lb li.me {
    background: linear-gradient(90deg, rgba(226,35,26,0.30), rgba(226,35,26,0));
    border-left: 3px solid var(--hk-red);
    padding-left: 11px;
  }
  .lb .rank { font-weight: 700; opacity: 0.65; text-align: center; }
  .lb li.gold .rank   { color: #ffd700; opacity: 1; text-shadow: 0 0 8px rgba(255,215,0,0.6); }
  .lb li.silver .rank { color: #c8c8c8; opacity: 1; }
  .lb li.bronze .rank { color: #cd7f32; opacity: 1; }
  .lb .name { font-weight: 700; text-transform: uppercase; }
  .lb .time { opacity: 0.85; font-weight: 600; }
  .lb .mode-pill {
    display: inline-block;
    font-size: 9px; opacity: 0.55; text-transform: uppercase;
    margin-left: 8px; padding: 2px 6px;
    border-radius: 999px; background: rgba(255,255,255,0.08);
    letter-spacing: 0.10em; font-weight: 600;
    vertical-align: middle;
  }
  .lb-empty {
    padding: 32px 16px; text-align: center; opacity: 0.5; font-style: italic; font-size: 13px;
  }
  .lb-title {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin: 14px 0 0;
    font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(255,255,255,0.65);
  }
  .lb-title::before, .lb-title::after {
    content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.10);
    max-width: 70px;
  }

  /* Bottle tilt when cap pops */
  .board-stage.tilt {
    animation: bottle-tilt 950ms cubic-bezier(.34, 1.4, .64, 1) forwards;
    transform-origin: 50% 92%;  /* pivot near base of bottle */
  }
  @keyframes bottle-tilt {
    0%   { transform: rotate(0deg); }
    18%  { transform: rotate(-6deg); }
    45%  { transform: rotate(3deg); }
    75%  { transform: rotate(-1.5deg); }
    100% { transform: rotate(0deg); }
  }

  /* Bottle cap overlay (rendered above board after win) */
  .bottle-cap {
    position: fixed;
    z-index: 540;
    pointer-events: none;
    will-change: transform, opacity;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
    transform-origin: 50% 50%;
    opacity: 0;
  }
  .bottle-cap.show {
    opacity: 1;
    animation: cap-pop 1.8s cubic-bezier(.4, .0, .6, 1) forwards;
  }
  @keyframes cap-pop {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
    8%   { transform: translate(0, 4px) scale(1.05) rotate(-3deg); }      /* anticipation */
    14%  { transform: translate(0, -8px) scale(1.12) rotate(2deg); }       /* pop */
    35%  { transform: translate(40px, -260px) scale(1.05) rotate(420deg); } /* peak arc */
    65%  { transform: translate(120px, -160px) scale(0.95) rotate(900deg); }
    100% { transform: translate(240px, 700px) scale(0.7) rotate(1620deg); opacity: 0; } /* fall off-screen */
  }

  /* Foam burst from bottle neck */
  .foam-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 530;
    overflow: hidden;
  }
  .foam-blob {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffffff 0%, #fbf5d8 40%, rgba(251,245,216,0.4) 70%, rgba(251,245,216,0) 100%);
    will-change: transform, opacity;
    animation: foam-rise 2.4s cubic-bezier(.2,.7,.3,1) forwards;
    filter: blur(0.5px);
    mix-blend-mode: screen;
  }
  @keyframes foam-rise {
    0%   { transform: translate(0,0) scale(0.2); opacity: 0; }
    15%  { transform: translate(var(--fx, 0), -10px) scale(0.6); opacity: 0.95; }
    60%  { transform: translate(calc(var(--fx, 0) * 2), -80px) scale(1.1); opacity: 0.7; }
    100% { transform: translate(calc(var(--fx, 0) * 3), -180px) scale(1.4); opacity: 0; }
  }

  /* Confetti canvas — drawn above dim backdrop, BELOW the win card */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 620;
  }

  /* Floating emoji burst (between confetti and dim) */
  .emoji-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 610;
    overflow: hidden;
  }
  .emoji-pop {
    position: absolute;
    font-size: 38px;
    animation: float-up 3.6s cubic-bezier(.2,.8,.2,1) forwards;
    will-change: transform, opacity;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
  }
  @keyframes float-up {
    0%   { transform: translateY(0)    rotate(0deg)   scale(0.4); opacity: 0; }
    15%  { transform: translateY(-30px) rotate(8deg)  scale(1.1); opacity: 1; }
    100% { transform: translateY(-90vh) rotate(540deg) scale(0.9); opacity: 0; }
  }

  /* Disco strobe lights */
  body.party::before {
    content: "";
    position: fixed; inset: 0;
    z-index: 400;
    pointer-events: none;
    background:
      radial-gradient(circle at 20% 20%, rgba(226,35,26,0.35), transparent 30%),
      radial-gradient(circle at 80% 30%, rgba(0,133,63,0.40), transparent 30%),
      radial-gradient(circle at 50% 80%, rgba(255,215,0,0.30), transparent 30%),
      radial-gradient(circle at 10% 90%, rgba(0,180,255,0.28), transparent 30%);
    animation: disco 1.2s steps(8) infinite;
    mix-blend-mode: screen;
  }
  @keyframes disco {
    0%   { background-position: 0% 0%, 100% 0%, 0% 100%, 100% 100%; filter: hue-rotate(0deg); }
    50%  { background-position: 100% 50%, 0% 50%, 50% 0%, 50% 100%; filter: hue-rotate(120deg); }
    100% { background-position: 0% 0%, 100% 0%, 0% 100%, 100% 100%; filter: hue-rotate(360deg); }
  }

  /* Win card: enhanced bounce-in for party */
  .win-overlay.party .win-card {
    animation: party-pulse 1.6s ease-in-out infinite;
  }
  @keyframes party-pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 0 rgba(226,35,26,0.6); }
    50%      { transform: scale(1.04); box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 24px rgba(226,35,26,0); }
  }

  /* Mobile: stack panels vertically when narrow */
  @media (max-width: 900px) {
    .ctrl-btn { font-size: 11px; padding: 6px 10px; letter-spacing: 0.02em; }
    .ctrl-btn .count { display: inline; }
  }
  @media (max-width: 700px) {
    main { flex-direction: column; }
    .tray, .board { flex: 1 1 50%; }
    .tray { border-right: none; border-bottom: 1px solid rgba(0,0,0,0.2); }
    header {
      height: auto; min-height: 52px; padding: 8px 12px;
      flex-wrap: wrap; gap: 6px;
    }
    .brand { font-size: 16px; }
    .brand .star { width: 18px; height: 18px; }
    .timer { font-size: 14px; padding: 4px 10px; }
    .controls { gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
    .ctrl-btn { font-size: 10px; padding: 5px 8px; }
    main { top: 108px; }
  }
</style>
</head>
<body>

      <path d="M12 2 L14.7 9.5 L22.5 9.5 L16.2 14.2 L18.6 21.6 L12 17.1 L5.4 21.6 L7.8 14.2 L1.5 9.5 L9.3 9.5 Z"/>

  <section class="tray" id="tray">
    <div class="lb-sidebar" id="lbSidebar">
      <div class="lb-sidebar-header">
        <svg class="star" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2 L14.7 9.5 L22.5 9.5 L16.2 14.2 L18.6 21.6 L12 17.1 L5.4 21.6 L7.8 14.2 L1.5 9.5 L9.3 9.5 Z"/>
        </svg>
        <span class="lb-sidebar-title">Leaderboard</span>
      </div>
      <div class="lb-sidebar-sub">Top 10 Heineken Solvers</div>
      <ol class="lb-sidebar-list" id="lbSidebarList"></ol>
      <div class="lb-sidebar-footer">Drink Responsibly · 18+</div>
    </div>
    <div class="tray-stage" id="trayStage"></div>
  </section>

    <div class="board-stage" id="boardStage">

<div class="win-overlay" id="winOverlay">
  <div class="win-card" id="winCard">
    <div id="winContent"></div>
  </div>
</div>

<script>
(() => {
  // ---------- Config ----------
  const COLS = 4;
  const ROWS = 5;
  const IMAGE_SRC = 'assets/heineken-bottle.png';
  const SNAP_FRACTION = 0.40;        // snap if pointer within 40% of piece size from correct centre (forgiving)
  const TAB_DEPTH = 0.20;            // fraction of piece edge length
  const PRE_SOLVED_FRACTION = 0.30;  // start with 30% of pieces already placed
  const HINT_COUNT = 3;              // hints allowed per game
  const ROTATE_TAP_PX = 6;           // pointer must move less than this to count as a tap (not drag)
  const ROTATE_TAP_MS = 220;         // and held less than this duration
  let SNAP_THRESHOLD = 28;           // recomputed once pieces are sized

  // ---------- State ----------
  let pieceW = 0, pieceH = 0;
  let boardOriginX = 0, boardOriginY = 0;     // top-left of target frame on board panel
  let trayOriginX = 0, trayOriginY = 0;       // top-left of tray scatter region
  let trayWidth = 0, trayHeight = 0;
  let pieces = [];
  let edgesH = []; // edgesH[r][c] = +1 (tab pointing down into row r+1) or -1
  let edgesV = []; // edgesV[r][c] = +1 (tab pointing right into col c+1) or -1
  let imageEl = null;
  let solvedCount = 0;
  let timerStart = 0;
  let timerHandle = null;
  let timerRunning = false;

  // Mode flags
  let hardMode = false;     // rotation enabled
  let dailyMode = false;    // seeded RNG by date
  let hintsLeft = HINT_COUNT;
  let solveTimeMs = 0;      // final time for share

  // Seeded RNG (mulberry32). When dailyMode is on, all randomness uses this.
  let _seedState = 0;
  function seedRng(seed) { _seedState = (seed >>> 0) || 1; }
  function srand() {
    _seedState |= 0; _seedState = (_seedState + 0x6D2B79F5) | 0;
    let t = Math.imul(_seedState ^ (_seedState >>> 15), 1 | _seedState);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rngRandom() { return dailyMode ? srand() : Math.random(); }
  function dailySeed() {
    const d = new Date();
    // Use NZ local date YYYYMMDD as seed
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return parseInt(`${y}${m}${day}`, 10);
  }
  function dailyLabel() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  // ---------- Utilities ----------
  const rand = (min, max) => Math.random() * (max - min) + min;
  const randSign = () => rngRandom() < 0.5 ? -1 : 1;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function fmtTime(ms) {
    const total = Math.floor(ms / 1000);
    const m = String(Math.floor(total / 60)).padStart(2, '0');
    const s = String(total % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  // ---------- Jigsaw path generation ----------
  // Build path for a piece in absolute SVG coords (within its own bounding box).
  // The piece's bounding box = [0, 0, pieceW + 2*depth, pieceH + 2*depth]
  // The piece's body (without tabs) is offset by (depth, depth).
  // edges: { top, right, bottom, left } each is 0 (flat), +1 (tab outward), -1 (tab inward)
  function buildPiecePath(pw, ph, depth, edges) {
    // Inner body corners (where edges actually run between)
    const x0 = depth;
    const y0 = depth;
    const x1 = depth + pw;
    const y1 = depth + ph;

    let d = `M ${x0} ${y0}`;
    d += edgePath(x0, y0, x1, y0, edges.top,    1, 0,  0, -1, pw, depth);  // top: rightward, perp = up
    d += edgePath(x1, y0, x1, y1, edges.right,  0, 1,  1,  0, ph, depth);  // right: downward, perp = right
    d += edgePath(x1, y1, x0, y1, edges.bottom, -1, 0, 0,  1, pw, depth);  // bottom: leftward, perp = down
    d += edgePath(x0, y1, x0, y0, edges.left,   0, -1, -1, 0, ph, depth);  // left: upward, perp = left
    d += ' Z';
    return d;
  }

  // Generate path commands for one edge of length L going from (sx,sy) along (ex,ey)
  // perpendicular outward direction (px, py) (unit vectors)
  // tabFlag: 0 flat, +1 tab in +perp direction, -1 tab in -perp direction
  //
  // Classic single-knob jigsaw shape: 35% flat → smooth rounded knob with slight neck → 35% flat.
  // Two cubic beziers form the knob (left half, right half) for a clean lollipop look.
  function edgePath(sx, sy, tx, ty, tabFlag, ex, ey, px, py, L, depth) {
    if (tabFlag === 0) {
      return ` L ${tx} ${ty}`;
    }
    const sign = tabFlag; // +1 outward, -1 inward
    const D = depth;      // perpendicular extent in pixels
    const at = (a, p) => [
      sx + a * ex + p * px * sign,
      sy + a * ey + p * py * sign
    ];

    const cmds = [];

    // 1) Straight from edge start to left base of neck
    const p0 = at(0.36 * L, 0);
    cmds.push(`L ${p0[0]} ${p0[1]}`);

    // 2) Left half of knob — bezier from neck-left to knob top.
    //    Control 1 sits just out from base, pulling slightly toward centre.
    //    Control 2 reaches out and high to create the rounded knob bulge.
    const c1a = at(0.30 * L, 0.16 * D);
    const c1b = at(0.13 * L, 0.85 * D);
    const top = at(0.50 * L, 0.85 * D);
    cmds.push(`C ${c1a[0]} ${c1a[1]}, ${c1b[0]} ${c1b[1]}, ${top[0]} ${top[1]}`);

    // 3) Right half of knob — mirror of left.
    const c2a = at(0.87 * L, 0.85 * D);
    const c2b = at(0.70 * L, 0.16 * D);
    const p1  = at(0.64 * L, 0);
    cmds.push(`C ${c2a[0]} ${c2a[1]}, ${c2b[0]} ${c2b[1]}, ${p1[0]} ${p1[1]}`);

    // 4) Straight to edge end
    cmds.push(`L ${tx} ${ty}`);

    return ' ' + cmds.join(' ');
  }

  // ---------- Build edges grid (interlocking neighbours) ----------
  function buildEdges() {
    edgesH = []; // horizontal edges: between row r and row r+1, for r in [0, ROWS-2]
    edgesV = []; // vertical edges: between col c and col c+1, for c in [0, COLS-2]
    for (let r = 0; r < ROWS - 1; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) row.push(randSign());
      edgesH.push(row);
    }
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS - 1; c++) row.push(randSign());
      edgesV.push(row);
    }
  }

  function pieceEdges(r, c) {
    // edges from piece's perspective:
    // top: 0 if r==0 else if edgesH[r-1][c]==+1 piece (r-1)->piece (r) tab points DOWN, so top of piece (r) is "tab inward" (-1)
    //                    else top of piece (r) is "tab outward" (+1)? Actually:
    // edgesH[r-1][c] sign convention: +1 means tab protrudes from row r-1 INTO row r (so piece (r-1)'s bottom is +1 outward, piece (r)'s top is -1 inward)
    //                                  -1 means tab protrudes from row r INTO row r-1 (piece (r-1)'s bottom is -1 inward, piece (r)'s top is +1 outward)
    let top = 0, right = 0, bottom = 0, left = 0;
    if (r > 0) top = -edgesH[r - 1][c]; // opposite of bottom-of-piece-above
    if (r < ROWS - 1) bottom = edgesH[r][c];
    if (c > 0) left = -edgesV[r][c - 1];
    if (c < COLS - 1) right = edgesV[r][c];
    return { top, right, bottom, left };
  }

  // ---------- Layout ----------
  function computeLayout() {
    const tray = document.getElementById('tray');
    const board = document.getElementById('board');
    const trayRect = tray.getBoundingClientRect();
    const boardRect = board.getBoundingClientRect();

    // Determine piece size that fits within board (with margin)
    const margin = 32;
    const availW = boardRect.width - margin * 2;
    const availH = boardRect.height - margin * 2;
    const cellW = availW / COLS;
    const cellH = availH / ROWS;
    // Pick uniform cell scale that preserves image aspect approximately equal
    // Image is portrait (~2:3). Piece cell aspect should match image cell aspect = 1/COLS : 1/ROWS of image.
    // We'll size piece to fit; image will be scaled to fit grid exactly.
    const cell = Math.min(cellW, cellH * (COLS * 0.8 / ROWS)); // bias slightly so portrait image fits
    pieceW = Math.floor(Math.min(cellW, cellH * 0.66));
    pieceH = Math.floor(pieceW * 1.5); // portrait pieces — image is taller than wide
    // Recompute: if total height exceeds avail, scale down
    if (pieceH * ROWS > availH) {
      pieceH = Math.floor(availH / ROWS);
      pieceW = Math.floor(pieceH / 1.5);
    }
    if (pieceW * COLS > availW) {
      pieceW = Math.floor(availW / COLS);
      pieceH = Math.floor(pieceW * 1.5);
    }

    const totalW = pieceW * COLS;
    const totalH = pieceH * ROWS;
    boardOriginX = Math.floor((boardRect.width - totalW) / 2);
    boardOriginY = Math.floor((boardRect.height - totalH) / 2);

    // Position target frame
    const tabDepth = Math.round(Math.min(pieceW, pieceH) * TAB_DEPTH);
    const frame = document.getElementById('targetFrame');
    frame.style.left = `${boardOriginX}px`;
    frame.style.top = `${boardOriginY}px`;
    frame.style.width = `${totalW}px`;
    frame.style.height = `${totalH}px`;

    // Slot grid SVG (faint lines)
    const slotSvg = document.getElementById('slotGrid');
    slotSvg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);
    slotSvg.style.left = `${boardOriginX}px`;
    slotSvg.style.top = `${boardOriginY}px`;
    slotSvg.style.width = `${totalW}px`;
    slotSvg.style.height = `${totalH}px`;
    slotSvg.innerHTML = '';
    for (let r = 1; r < ROWS; r++) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', 0);
      line.setAttribute('x2', totalW);
      line.setAttribute('y1', r * pieceH);
      line.setAttribute('y2', r * pieceH);
      line.setAttribute('stroke', 'rgba(0,0,0,0.18)');
      line.setAttribute('stroke-width', '1');
      slotSvg.appendChild(line);
    }
    for (let c = 1; c < COLS; c++) {
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', c * pieceW);
      line.setAttribute('x2', c * pieceW);
      line.setAttribute('y1', 0);
      line.setAttribute('y2', totalH);
      line.setAttribute('stroke', 'rgba(0,0,0,0.18)');
      line.setAttribute('stroke-width', '1');
      slotSvg.appendChild(line);
    }

    // Tray scatter region
    trayOriginX = 16;
    trayOriginY = 16;
    trayWidth = trayRect.width - 32;
    trayHeight = trayRect.height - 32;

    return { tabDepth, totalW, totalH };
  }

  // Analyze image at piece-grid resolution and return 2D boolean array
  // skip[r][c] = true if that cell is mostly background (no meaningful content).
  // We auto-place those so the user only puzzles the bottle, not the black backdrop.
  function analyzeImageRegions(totalW, totalH) {
    const canvas = document.createElement('canvas');
    canvas.width = totalW;
    canvas.height = totalH;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imageEl, 0, 0, totalW, totalH);
    const skip = [];
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) {
        let bright = 0, total = 0;
        const data = ctx.getImageData(c * pieceW, r * pieceH, pieceW, pieceH).data;
        for (let i = 0; i < data.length; i += 4) {
          const lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
          if (lum > 60) bright++;
          total++;
        }
        // Less than 4% bright pixels = empty / background piece
        row.push((bright / total) < 0.04);
      }
      skip.push(row);
    }
    return skip;
  }

  // ---------- Build pieces ----------
  function buildPieces() {
    const trayStage = document.getElementById('trayStage');
    trayStage.innerHTML = '';
    const defs = document.getElementById('svgDefs');
    defs.innerHTML = '';

    const { tabDepth } = computeLayout();
    const totalImgW = pieceW * COLS;
    const totalImgH = pieceH * ROWS;

    // Recompute forgiving snap threshold based on actual piece size
    SNAP_THRESHOLD = Math.round(Math.min(pieceW, pieceH) * SNAP_FRACTION);

    // Detect background-only cells
    const skip = analyzeImageRegions(totalImgW, totalImgH);

    pieces = [];

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const id = `piece-${r}-${c}`;
        const edges = pieceEdges(r, c);

        // Bounding box dims (with overhang for tabs)
        const bbW = pieceW + tabDepth * 2;
        const bbH = pieceH + tabDepth * 2;

        // Build SVG path
        const pathD = buildPiecePath(pieceW, pieceH, tabDepth, edges);

        // Image offset within bounding box (so the bottle image aligns globally)
        // Piece (r,c) shows region of image: x in [c*pieceW, (c+1)*pieceW], y in [r*pieceH, (r+1)*pieceH]
        // In the bounding box, the piece body starts at (tabDepth, tabDepth)
        // So image needs to be drawn at: x = tabDepth - c*pieceW, y = tabDepth - r*pieceH
        const imgX = tabDepth - c * pieceW;
        const imgY = tabDepth - r * pieceH;

        // Each piece is its own SVG with the image and the path as a clip
        const wrapper = document.createElement('div');
        wrapper.className = 'piece';
        wrapper.dataset.r = r;
        wrapper.dataset.c = c;
        wrapper.dataset.id = id;
        wrapper.style.width = `${bbW}px`;
        wrapper.style.height = `${bbH}px`;

        const clipId = `clip-${r}-${c}`;
        const svg = `
          <svg width="${bbW}" height="${bbH}" viewBox="0 0 ${bbW} ${bbH}">
            <defs>
              <clipPath id="${clipId}">
                <path d="${pathD}"/>
              </clipPath>
            </defs>
            <g clip-path="url(#${clipId})">
              <image href="${IMAGE_SRC}" x="${imgX}" y="${imgY}" width="${totalImgW}" height="${totalImgH}" preserveAspectRatio="none"/>
            </g>
            <path d="${pathD}" fill="none" stroke="rgba(0,0,0,0.55)" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
        `;
        wrapper.innerHTML = svg;
        trayStage.appendChild(wrapper);

        // Compute home position: where the piece's bounding box top-left should be
        // when piece is correctly placed on board (in BOARD coordinates).
        // piece body starts at (boardOriginX + c*pieceW, boardOriginY + r*pieceH) on the board panel
        // bounding box top-left = body - (tabDepth, tabDepth)
        const homeX = boardOriginX + c * pieceW - tabDepth;
        const homeY = boardOriginY + r * pieceH - tabDepth;

        // Random scatter position in tray (in tray panel coords)
        const sx = clamp(rngRandom() * (trayWidth - bbW), trayOriginX, trayOriginX + trayWidth - bbW);
        const sy = clamp(rngRandom() * (trayHeight - bbH), trayOriginY, trayOriginY + trayHeight - bbH);

        // Initial rotation: 0 in normal mode; random 90° increment in hard mode
        const rotDeg = hardMode ? (Math.floor(rngRandom() * 4) * 90) : 0;

        const isBackground = skip[r][c];

        const piece = {
          id, r, c, el: wrapper,
          bbW, bbH,
          homeX, homeY,
          x: isBackground ? homeX : sx,
          y: isBackground ? homeY : sy,
          rot: isBackground ? 0 : rotDeg,
          parent: isBackground ? 'board' : 'tray',
          locked: !!isBackground,
          autoPlaced: !!isBackground
        };

        if (isBackground) {
          // Auto-place: render directly on board, locked, no drag handler
          document.getElementById('boardStage').appendChild(wrapper);
          wrapper.classList.add('locked');
          positionPiece(piece);
          solvedCount++;
        } else {
          if (hardMode) wrapper.classList.add('rotatable');
          positionPiece(piece);
          attachDrag(piece);
        }
        pieces.push(piece);
      }
    }

    prePlaceSome();
  }

  // Pre-solve: lock PRE_SOLVED_FRACTION of REMAINING pieces (not auto-placed) at their home positions.
  // Picks pieces randomly so the starting state varies each load.
  function prePlaceSome() {
    const candidates = pieces.filter(p => !p.locked); // exclude auto-placed background cells
    const n = Math.round(candidates.length * PRE_SOLVED_FRACTION);
    if (n <= 0) return;

    const boardStage = document.getElementById('boardStage');
    // Shuffle a copy
    const pool = [...candidates];
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(rngRandom() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    for (let k = 0; k < n; k++) {
      const piece = pool[k];
      boardStage.appendChild(piece.el);
      piece.parent = 'board';
      piece.x = piece.homeX;
      piece.y = piece.homeY;
      piece.rot = 0;
      piece.locked = true;
      piece.el.classList.add('locked');
      positionPiece(piece);
      solvedCount++;
    }
  }

  // Position piece via transform translate (and rotation, in hard mode)
  function positionPiece(piece) {
    if (piece.rot) {
      piece.el.style.transform = `translate(${piece.x}px, ${piece.y}px) rotate(${piece.rot}deg)`;
      piece.el.style.transformOrigin = '50% 50%';
    } else {
      piece.el.style.transform = `translate(${piece.x}px, ${piece.y}px)`;
    }
  }

  // Move a piece between tray and board DOM (preserving visual position)
  function reparent(piece, target) {
    if (piece.parent === target) return;
    const trayRect = document.getElementById('tray').getBoundingClientRect();
    const boardRect = document.getElementById('board').getBoundingClientRect();
    if (piece.parent === 'tray' && target === 'board') {
      // Convert tray-local coords to board-local coords
      const absX = trayRect.left + piece.x;
      const absY = trayRect.top + piece.y;
      piece.x = absX - boardRect.left;
      piece.y = absY - boardRect.top;
      document.getElementById('boardStage').appendChild(piece.el);
    } else if (piece.parent === 'board' && target === 'tray') {
      const absX = boardRect.left + piece.x;
      const absY = boardRect.top + piece.y;
      piece.x = absX - trayRect.left;
      piece.y = absY - trayRect.top;
      document.getElementById('trayStage').appendChild(piece.el);
    }
    piece.parent = target;
    positionPiece(piece);
  }

  // ---------- Drag handling ----------
  function attachDrag(piece) {
    const el = piece.el;
    let active = false;
    let pointerId = null;
    let startPointerX = 0, startPointerY = 0;
    let startPieceX = 0, startPieceY = 0;
    let downTime = 0;
    let moved = false;

    el.addEventListener('pointerdown', onDown);

    function onDown(e) {
      if (piece.locked) return;
      e.preventDefault();
      active = true;
      moved = false;
      downTime = performance.now();
      pointerId = e.pointerId;
      el.setPointerCapture(pointerId);
      el.classList.add('dragging');
      el.classList.remove('snap-anim', 'return-anim');

      // Bring piece to front by re-appending in current parent
      el.parentNode.appendChild(el);

      // Get piece's current absolute position (page coords)
      const rect = el.getBoundingClientRect();
      // Move piece into top-level "drag layer" — body — to escape panel clipping
      moveToDragLayer(piece, rect.left, rect.top);

      startPointerX = e.clientX;
      startPointerY = e.clientY;
      startPieceX = piece.x;
      startPieceY = piece.y;

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);

      ensureTimerRunning();
    }

    function onMove(e) {
      if (!active) return;
      const dx = e.clientX - startPointerX;
      const dy = e.clientY - startPointerY;
      if (!moved && Math.hypot(dx, dy) > ROTATE_TAP_PX) moved = true;
      piece.x = startPieceX + dx;
      piece.y = startPieceY + dy;
      positionPiece(piece);
    }

    function onUp(e) {
      if (!active) return;
      active = false;
      try { el.releasePointerCapture(pointerId); } catch (_) {}
      el.classList.remove('dragging');
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);

      const elapsed = performance.now() - downTime;

      // Hard mode: tap without drag → rotate 90° in place
      if (hardMode && !moved && elapsed < ROTATE_TAP_MS) {
        const trayRect = document.getElementById('tray').getBoundingClientRect();
        const boardRect = document.getElementById('board').getBoundingClientRect();
        const overBoard = e.clientX >= boardRect.left && e.clientX <= boardRect.right &&
                          e.clientY >= boardRect.top && e.clientY <= boardRect.bottom;
        const target = overBoard ? 'board' : 'tray';
        // Convert piece.x/y from page (drag layer) back into target panel coords.
        // reparentFromDragLayer does that conversion.
        reparentFromDragLayer(piece, target);
        piece.rot = (piece.rot + 90) % 360;
        const panelRect = (target === 'board' ? boardRect : trayRect);
        piece.x = clamp(piece.x, 4, panelRect.width - piece.bbW - 4);
        piece.y = clamp(piece.y, 4, panelRect.height - piece.bbH - 4);
        positionPiece(piece);
        if (navigator.vibrate) navigator.vibrate(12);
        return;
      }

      // Normal drop logic
      const boardRect = document.getElementById('board').getBoundingClientRect();
      const trayRect = document.getElementById('tray').getBoundingClientRect();
      const homePageX = boardRect.left + piece.homeX;
      const homePageY = boardRect.top + piece.homeY;

      const pieceCentreX = piece.x + piece.bbW / 2;
      const pieceCentreY = piece.y + piece.bbH / 2;
      const homeCentreX = homePageX + piece.bbW / 2;
      const homeCentreY = homePageY + piece.bbH / 2;
      const dist = Math.hypot(pieceCentreX - homeCentreX, pieceCentreY - homeCentreY);

      // Snap requires both position close AND rotation correct (0°)
      const rotCorrect = (piece.rot % 360) === 0;

      if (dist <= SNAP_THRESHOLD && rotCorrect) {
        // Snap to home
        el.classList.add('snap-anim');
        piece.x = homePageX;
        piece.y = homePageY;
        positionPiece(piece);
        setTimeout(() => {
          reparentFromDragLayer(piece, 'board');
          piece.locked = true;
          el.classList.remove('snap-anim');
          el.classList.add('locked');
          solvedCount++;
          spawnSnapGlow(homePageX, homePageY, piece.bbW, piece.bbH);
          playSnapClick();
          if (navigator.vibrate) navigator.vibrate(30);
          checkWin();
        }, 200);
      } else {
        const ux = e.clientX, uy = e.clientY;
        const overBoard = ux >= boardRect.left && ux <= boardRect.right && uy >= boardRect.top && uy <= boardRect.bottom;
        const target = overBoard ? 'board' : 'tray';

        reparentFromDragLayer(piece, target);
        const panelRect = (target === 'board' ? boardRect : trayRect);
        piece.x = clamp(piece.x, 4, panelRect.width - piece.bbW - 4);
        piece.y = clamp(piece.y, 4, panelRect.height - piece.bbH - 4);
        el.classList.add('return-anim');
        positionPiece(piece);
        setTimeout(() => el.classList.remove('return-anim'), 360);
      }
    }
  }

  // Green snap flash at the lock position (page coords)
  function spawnSnapGlow(pageX, pageY, w, h) {
    const glow = document.createElement('div');
    glow.className = 'snap-glow';
    glow.style.left = `${pageX}px`;
    glow.style.top = `${pageY}px`;
    glow.style.width = `${w}px`;
    glow.style.height = `${h}px`;
    document.body.appendChild(glow);
    setTimeout(() => glow.remove(), 700);

  // Move piece into <body> drag layer so it's not clipped by panel overflow
  function moveToDragLayer(piece, pageX, pageY) {
    if (piece.parent === 'drag') return;
    document.body.appendChild(piece.el);
    piece.parent = 'drag';
    piece.x = pageX;
    piece.y = pageY;
    positionPiece(piece);
  }

  function reparentFromDragLayer(piece, target) {
    const stage = document.getElementById(target === 'board' ? 'boardStage' : 'trayStage');
    const stageRect = stage.getBoundingClientRect();
    // Convert page coords to stage-local
    piece.x = piece.x - stageRect.left;
    piece.y = piece.y - stageRect.top;
    stage.appendChild(piece.el);
    piece.parent = target;
    positionPiece(piece);
  }

  // ---------- Timer ----------
  function ensureTimerRunning() {
    if (timerRunning) return;
    timerRunning = true;
    timerStart = performance.now();
    timerHandle = setInterval(() => {
      const elapsed = performance.now() - timerStart;
      document.getElementById('timer').textContent = fmtTime(elapsed);
    }, 250);
  }
  function stopTimer() {
    if (!timerRunning) return;
    timerRunning = false;
    clearInterval(timerHandle);
  }

  // ---------- Win ----------
  function checkWin() {
    if (solvedCount === ROWS * COLS) {
      stopTimer();
      solveTimeMs = timerStart > 0 ? (performance.now() - timerStart) : 0;
      // 1. Beat for last snap settle
      // 2. Bottle opens (cap flies off, foam spurts, pop sound)
      // 3. Confetti + emoji + jingle + cheer + leaderboard name prompt
      setTimeout(openBottle, 300);
      setTimeout(startParty, 1100);
    }

  // ---------- Bottle open animation ----------
  function openBottle() {
    const board = document.getElementById('board');
    const boardRect = board.getBoundingClientRect();

    // Cap geometry — derived from board target frame
    const frameW = pieceW * COLS;
    const frameH = pieceH * ROWS;
    const frameLeft = boardRect.left + boardOriginX;
    const frameTop = boardRect.top + boardOriginY;

    // Bottle cap position on bottle image (empirical for the Heineken bottle PNG)
    // Cap centre ≈ horizontal middle, ~5.5% from top of image. Cap radius ≈ 8.5% of image width.
    const capCx = frameLeft + frameW * 0.5;
    const capCy = frameTop + frameH * 0.055;
    const capR = frameW * 0.085;
    const capSize = capR * 2;

    // Build SVG cap with serrated edge + Heineken-style star
    const serrations = 24;
    const innerR = 40;
    const outerR = 47;
    let serrPath = '';
    for (let i = 0; i < serrations; i++) {
      const a1 = (i / serrations) * Math.PI * 2;
      const a2 = ((i + 0.5) / serrations) * Math.PI * 2;
      const x1 = Math.cos(a1) * outerR;
      const y1 = Math.sin(a1) * outerR;
      const x2 = Math.cos(a2) * innerR;
      const y2 = Math.sin(a2) * innerR;
      serrPath += `${i === 0 ? 'M' : 'L'} ${x1.toFixed(2)} ${y1.toFixed(2)} L ${x2.toFixed(2)} ${y2.toFixed(2)} `;
    }
    serrPath += 'Z';

    const capSVG = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100" width="${capSize}" height="${capSize}">
        <defs>
          <radialGradient id="capGrad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ff5b50"/>
            <stop offset="60%" stop-color="#e2231a"/>
            <stop offset="100%" stop-color="#8a0d07"/>
          </radialGradient>
        </defs>
        <path d="${serrPath}" fill="url(#capGrad)" stroke="rgba(0,0,0,0.4)" stroke-width="0.8"/>
        <circle r="36" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.8"/>
        <circle r="30" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="0.6"/>
        <!-- Heineken white star -->
        <polygon points="0,-18 5.3,-5.6 18,-5.6 7.3,3.5 11.1,16.6 0,8.7 -11.1,16.6 -7.3,3.5 -18,-5.6 -5.3,-5.6" fill="white" opacity="0.95"/>
        <!-- highlight glint -->
        <ellipse cx="-15" cy="-22" rx="11" ry="6" fill="white" opacity="0.35" transform="rotate(-25)"/>
      </svg>
    `;

    const cap = document.createElement('div');
    cap.className = 'bottle-cap';
    cap.style.left = `${capCx - capR}px`;
    cap.style.top = `${capCy - capR}px`;
    cap.style.width = `${capSize}px`;
    cap.style.height = `${capSize}px`;
    cap.innerHTML = capSVG;
    document.body.appendChild(cap);

    // Trigger animation next frame so opacity transition kicks in cleanly
    requestAnimationFrame(() => cap.classList.add('show'));

    // Tilt the bottle (board stage with locked pieces) as the cap launches
    const boardStage = document.getElementById('boardStage');
    boardStage.classList.remove('tilt');
    void boardStage.offsetWidth; // force reflow so animation restarts cleanly
    boardStage.classList.add('tilt');
    setTimeout(() => boardStage.classList.remove('tilt'), 1000);

    // No pop sound — only YouTube cheers plays during celebration

    // Foam bursts from the neck slightly after cap clears (around 250ms)
    setTimeout(() => spawnFoam(capCx, capCy + capR * 0.8), 220);
    setTimeout(() => spawnFoam(capCx, capCy + capR * 1.2), 420);
    setTimeout(() => spawnFoam(capCx, capCy + capR * 1.5), 620);

    // Cleanup cap after animation
    setTimeout(() => cap.remove(), 2000);
  }

  function spawnFoam(centerX, centerY) {

  // POP sound: champagne-style cork pop — pitched thump + carbonation hiss + bottle echo
  function synthPop() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const now = ctx.currentTime;

      // Slap-back reverb for "bottle resonance"
      const reverb = ctx.createConvolver();
      reverb.buffer = buildReverbIR(ctx, 0.6, 3.5);
      const wet = ctx.createGain();
      wet.gain.value = 0.25;
      reverb.connect(wet).connect(ctx.destination);

      // "Tock" cork pluck — pitched sine going UP fast then dropping (classic cork shape)
      const tock = ctx.createOscillator();
      const tockG = ctx.createGain();
      tock.type = 'sine';
      tock.frequency.setValueAtTime(110, now);
      tock.frequency.exponentialRampToValueAtTime(420, now + 0.012);
      tock.frequency.exponentialRampToValueAtTime(60, now + 0.18);
      tockG.gain.setValueAtTime(0, now);
      tockG.gain.linearRampToValueAtTime(0.45, now + 0.006);
      tockG.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      tock.connect(tockG).connect(ctx.destination);
      tockG.connect(reverb);
      tock.start(now);
      tock.stop(now + 0.25);

      // Sub-thump for bass weight
      const sub = ctx.createOscillator();
      const subG = ctx.createGain();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(80, now);
      sub.frequency.exponentialRampToValueAtTime(35, now + 0.18);
      subG.gain.setValueAtTime(0, now);
      subG.gain.linearRampToValueAtTime(0.30, now + 0.008);
      subG.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      sub.connect(subG).connect(ctx.destination);
      sub.start(now);
      sub.stop(now + 0.3);

      // "Pssshh" carbonation hiss — pink noise high-passed, longer tail
      const hissDur = 0.45;
      const buf = ctx.createBuffer(1, ctx.sampleRate * hissDur, ctx.sampleRate);
      const d = buf.getChannelData(0);
      let lastOut = 0;
      for (let i = 0; i < d.length; i++) {
        // Brown noise (smoother than white) for natural fizz
        const w = (Math.random() * 2 - 1) * 0.5;
        lastOut = (lastOut + 0.02 * w) / 1.02;
        d[i] = lastOut * 3;
      }
      const hiss = ctx.createBufferSource();
      hiss.buffer = buf;
      const hissHP = ctx.createBiquadFilter();
      hissHP.type = 'highpass';
      hissHP.frequency.setValueAtTime(800, now);
      hissHP.frequency.linearRampToValueAtTime(2500, now + 0.3);
      const hissG = ctx.createGain();
      hissG.gain.setValueAtTime(0, now);
      hissG.gain.linearRampToValueAtTime(0.18, now + 0.03);
      hissG.gain.exponentialRampToValueAtTime(0.001, now + hissDur);
      hiss.connect(hissHP).connect(hissG).connect(ctx.destination);
      hissG.connect(reverb);
      hiss.start(now + 0.005);
      hiss.stop(now + hissDur);

      setTimeout(() => { try { ctx.close(); } catch(_){} }, 1200);
    } catch (_) { /* silent */ }
  }
  function playPop() { playFileOrSynth('pop', synthPop, 0.8); }

  // -- Confetti --
  let confettiRAF = null;
  let confettiParticles = [];
  let confettiCtx = null;

  function fireConfetti() {
    const canvas = document.getElementById('confetti');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const resize = () => {
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      confettiCtx = canvas.getContext('2d');
      confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    window.addEventListener('resize', resize);

    // Heineken-leaning palette + accents
    const colors = ['#e2231a', '#ff5b50', '#00853f', '#00a14e', '#ffd700', '#ffb300', '#ffffff', '#00b4ff'];
    const W = window.innerWidth;
    const H = window.innerHeight;

    confettiParticles = [];

    // Wind drifts slowly over time for organic feel
    const wind = { vx: 0, target: 0 };

    function makeParticle(opts) {
      const types = ['strip', 'ribbon', 'star', 'square'];
      const t = opts.type || types[Math.floor(Math.random() * types.length)];
      const color = colors[Math.floor(Math.random() * colors.length)];
      const w = t === 'ribbon' ? 4 + Math.random() * 4 : 7 + Math.random() * 7;
      const h = t === 'ribbon' ? 22 + Math.random() * 22 :
                t === 'square' ? w :
                t === 'star'   ? 10 + Math.random() * 8 :
                                 11 + Math.random() * 10; // strip
      return {
        type: t,
        x: opts.x, y: opts.y,
        vx: opts.vx, vy: opts.vy,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.35,
        // Phase for 3D-flip simulation (squash on each axis based on rotation)
        flipAxis: Math.random() < 0.5 ? 'x' : 'y',
        flipSpeed: 0.06 + Math.random() * 0.05,
        flipPhase: Math.random() * Math.PI * 2,
        w, h, color,
        sparkle: Math.random() < 0.20, // some particles twinkle
        life: 0,
        maxLife: 240 + Math.random() * 120
      };
    }

    const burstUp = (originX, originY, vxBias, count) => {
      for (let i = 0; i < count; i++) {
        const angle = (-Math.PI / 2) + (Math.random() - 0.5) * 1.0 + vxBias * 0.3;
        const speed = 9 + Math.random() * 13;
        confettiParticles.push(makeParticle({
          x: originX, y: originY,
          vx: Math.cos(angle) * speed + vxBias,
          vy: Math.sin(angle) * speed
        }));
      }
    };
    const dropDown = (x, vxBias, count) => {
      for (let i = 0; i < count; i++) {
        confettiParticles.push(makeParticle({
          x: x + (Math.random() - 0.5) * 80,
          y: -20 - Math.random() * 40,
          vx: vxBias + (Math.random() - 0.5) * 4,
          vy: 2 + Math.random() * 3
        }));
      }
    };

    // 4 cannon bursts from corners
    burstUp(W * 0.08, H * 0.92, 7, 160);
    burstUp(W * 0.92, H * 0.92, -7, 160);
    setTimeout(() => { burstUp(W * 0.30, H * 0.95, 4, 110); burstUp(W * 0.70, H * 0.95, -4, 110); }, 280);
    // Top rain
    setTimeout(() => { dropDown(W * 0.20, 1.5, 80); dropDown(W * 0.80, -1.5, 80); }, 700);
    // Center pop
    setTimeout(() => burstUp(W * 0.50, H * 0.60, 0, 90), 1100);

    cancelAnimationFrame(confettiRAF);
    const gravity = 0.30;
    const drag = 0.993;

    const drawStar = (ctx, r) => {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
        const rad = i % 2 === 0 ? r : r * 0.42;
        const x = Math.cos(a) * rad;
        const y = Math.sin(a) * rad;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
    };

    const tick = () => {
      const ctx = confettiCtx;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      // Drift wind toward a new target every ~60 frames
      if (Math.random() < 0.018) wind.target = (Math.random() - 0.5) * 1.4;
      wind.vx += (wind.target - wind.vx) * 0.025;

      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.life++;
        p.vy += gravity;
        p.vx = p.vx * drag + wind.vx * 0.04;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vrot;
        p.flipPhase += p.flipSpeed;

        const fade = p.life > p.maxLife - 40
          ? Math.max(0, (p.maxLife - p.life) / 40)
          : 1;

        // 3D-flip simulation: scale one axis with cos(phase)
        const flipScale = Math.abs(Math.cos(p.flipPhase)) * 0.85 + 0.15;
        const lightSide = Math.cos(p.flipPhase) > 0; // toggles which side is "lit"

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        if (p.flipAxis === 'x') ctx.scale(flipScale, 1);
        else                    ctx.scale(1, flipScale);
        ctx.globalAlpha = fade;

        // Slight glow
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 6;

        // "Back" side a bit darker
        ctx.fillStyle = lightSide ? p.color : shadeColor(p.color, -0.30);

        if (p.type === 'star') {
          drawStar(ctx, p.h * 0.5);
          ctx.fill();
          // Small inner highlight
          ctx.globalAlpha = fade * 0.6;
          ctx.fillStyle = '#ffffff';
          drawStar(ctx, p.h * 0.22);
          ctx.fill();
        } else if (p.type === 'ribbon') {
          // Long thin wavy ribbon — draw as filled curved rect via path
          ctx.beginPath();
          const w2 = p.w / 2, h2 = p.h / 2;
          ctx.moveTo(-w2, -h2);
          ctx.lineTo( w2, -h2);
          ctx.lineTo( w2,  h2);
          ctx.lineTo(-w2,  h2);
          ctx.closePath();
          ctx.fill();
          // Highlight stripe
          ctx.globalAlpha = fade * 0.45;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-w2 * 0.3, -h2, w2 * 0.6, p.h);
        } else {
          // square / strip
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          // Edge highlight
          ctx.globalAlpha = fade * 0.5;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, Math.max(1, p.h * 0.18));
        }

        // Sparkle dot
        if (p.sparkle && Math.sin(p.life * 0.3) > 0.5) {
          ctx.globalAlpha = fade;
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(0, 0, 1.4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();

        if (p.life > p.maxLife || p.y > window.innerHeight + 60) {
          confettiParticles.splice(i, 1);
        }
      }
      if (confettiParticles.length > 0) {
        confettiRAF = requestAnimationFrame(tick);
      } else {
        cancelAnimationFrame(confettiRAF);
        confettiRAF = null;
      }
    };
    confettiRAF = requestAnimationFrame(tick);
  }

  // Darken/lighten a hex color by `amt` (-1..1). Returns "rgb(r,g,b)".
  function shadeColor(hex, amt) {
    const h = hex.replace('#','');
    const num = parseInt(h.length === 3
      ? h.split('').map(x => x + x).join('')
      : h, 16);
    let r = (num >> 16) & 255;
    let g = (num >>  8) & 255;
    let b =  num        & 255;
    const f = amt < 0 ? (1 + amt) : 1;
    const add = amt > 0 ? Math.round(255 * amt) : 0;
    r = Math.min(255, Math.max(0, Math.round(r * f + add)));
    g = Math.min(255, Math.max(0, Math.round(g * f + add)));
    b = Math.min(255, Math.max(0, Math.round(b * f + add)));
    return `rgb(${r},${g},${b})`;
  }

  function stopConfetti() {
    confettiParticles = [];
    if (confettiCtx) {
      const c = document.getElementById('confetti');
      confettiCtx.clearRect(0, 0, c.width, c.height);
    }
  }

  // ---------- Audio: file-with-synth-fallback ----------
  // Drop pop.mp3 / jingle.mp3 / cheers.mp3 into assets/audio/ to override synth.
  const audioFiles = { pop: null, jingle: null, cheers: null };
  let audioLoaded = false;
  function tryLoadAudioFiles() {
    if (audioLoaded) return;
    audioLoaded = true;
    ['pop', 'jingle', 'cheers'].forEach(name => {
      const a = new Audio();
      a.preload = 'auto';
      // Suppress decode errors in console for missing files
      a.addEventListener('canplaythrough', () => { audioFiles[name] = a; }, { once: true });
      a.addEventListener('error', () => { /* file absent — synth fallback */ }, { once: true });
      a.src = `assets/audio/${name}.mp3`;
    });
  }
  function playFileOrSynth(name, synthFn, volume = 0.7) {
    const a = audioFiles[name];
    if (a && a.readyState >= 3) {
      const clone = a.cloneNode(true);
      clone.volume = volume;
      clone.play().catch(() => synthFn());
    } else {
      synthFn();
    }
  }

  // Build a synthesized reverb impulse response (slap-back stadium ambience)
  function buildReverbIR(ctx, duration = 1.4, decay = 2.5) {
    const len = Math.floor(ctx.sampleRate * duration);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return ir;
  }

  // -- Triumphant jingle: 5-note ascending motif with marimba + brass + sub + reverb
  function synthJingle() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const now = ctx.currentTime;

      // Master reverb
      const reverb = ctx.createConvolver();
      reverb.buffer = buildReverbIR(ctx, 1.6, 2.8);
      const wet = ctx.createGain();
      wet.gain.value = 0.22;
      reverb.connect(wet).connect(ctx.destination);

      // G3 → C4 → E4 → G4 → C5 (open chord arpeggio resolving up)
      const notes = [
        { f: 196.00, t: 0.00, d: 0.22 },
        { f: 261.63, t: 0.16, d: 0.22 },
        { f: 329.63, t: 0.32, d: 0.22 },
        { f: 392.00, t: 0.48, d: 0.22 },
        { f: 523.25, t: 0.66, d: 1.10 }
      ];

      notes.forEach((n, i) => {
        const start = now + n.t;
        const stop = start + n.d;

        // Marimba pluck (sine + fast decay) — brightness
        const pluck = ctx.createOscillator();
        const pluckG = ctx.createGain();
        pluck.type = 'sine';
        pluck.frequency.value = n.f * 2; // octave up for sparkle
        pluckG.gain.setValueAtTime(0, start);
        pluckG.gain.linearRampToValueAtTime(0.22, start + 0.005);
        pluckG.gain.exponentialRampToValueAtTime(0.001, stop);
        pluck.connect(pluckG);
        pluckG.connect(ctx.destination);
        pluckG.connect(reverb);
        pluck.start(start);
        pluck.stop(stop + 0.05);

        // Brass body (sawtooth through LP filter) — warmth
        const brass = ctx.createOscillator();
        const filt = ctx.createBiquadFilter();
        const brassG = ctx.createGain();
        brass.type = 'sawtooth';
        brass.frequency.value = n.f;
        filt.type = 'lowpass';
        filt.frequency.setValueAtTime(n.f * 3, start);
        filt.frequency.linearRampToValueAtTime(n.f * 5, start + 0.08);
        filt.frequency.exponentialRampToValueAtTime(n.f * 2, stop);
        filt.Q.value = 6;
        brassG.gain.setValueAtTime(0, start);
        brassG.gain.linearRampToValueAtTime(0.10, start + 0.035);
        brassG.gain.linearRampToValueAtTime(0.07, start + n.d * 0.5);
        brassG.gain.exponentialRampToValueAtTime(0.001, stop);
        brass.connect(filt).connect(brassG);
        brassG.connect(ctx.destination);
        brassG.connect(reverb);
        brass.start(start);
        brass.stop(stop + 0.05);

        // Sub-bass on final resolution
        if (i === notes.length - 1) {
          const sub = ctx.createOscillator();
          const subG = ctx.createGain();
          sub.type = 'sine';
          sub.frequency.value = n.f * 0.5;
          subG.gain.setValueAtTime(0, start);
          subG.gain.linearRampToValueAtTime(0.18, start + 0.04);
          subG.gain.exponentialRampToValueAtTime(0.001, stop);
          sub.connect(subG).connect(ctx.destination);
          sub.start(start);
          sub.stop(stop + 0.05);

          // Cymbal crash on final note (high-passed noise)
          const cymBuf = ctx.createBuffer(1, ctx.sampleRate * 0.9, ctx.sampleRate);
          const cd = cymBuf.getChannelData(0);
          for (let j = 0; j < cd.length; j++) cd[j] = (Math.random() * 2 - 1) * 0.5;
          const cym = ctx.createBufferSource();
          cym.buffer = cymBuf;
          const cymHP = ctx.createBiquadFilter();
          cymHP.type = 'highpass';
          cymHP.frequency.value = 5000;
          const cymG = ctx.createGain();
          cymG.gain.setValueAtTime(0.0001, start);
          cymG.gain.linearRampToValueAtTime(0.12, start + 0.008);
          cymG.gain.exponentialRampToValueAtTime(0.0001, start + 0.9);
          cym.connect(cymHP).connect(cymG);
          cymG.connect(ctx.destination);
          cymG.connect(reverb);
          cym.start(start);
        }
      });

      setTimeout(() => { try { ctx.close(); } catch(_){} }, 3500);
    } catch (_) { /* silent */ }
  }
  function playJingle() { playFileOrSynth('jingle', synthJingle, 0.65); }

  // -- Crowd cheer: layered crowd simulation
  //    Layer A: sustained pink-noise wash with formant sweep ("WOOOO!")
  //    Layer B: 18 individual voice bursts staggered across 2s ("hey! yeah! wooo!")
  //    Layer C: applause rhythm (noise transients ~7Hz density)
  //    Layer D: 4 whistles (rising sine pings)
  //    Master: lush reverb
  function synthCheer() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const now = ctx.currentTime;
      const dur = 2.4;

      // Master reverb (stadium)
      const reverb = ctx.createConvolver();
      reverb.buffer = buildReverbIR(ctx, 1.8, 2.2);
      const wet = ctx.createGain();
      wet.gain.value = 0.32;
      reverb.connect(wet).connect(ctx.destination);

      // Helper: create pink noise buffer
      const makePinkBuf = (seconds) => {
        const n = Math.floor(ctx.sampleRate * seconds);
        const buf = ctx.createBuffer(1, n, ctx.sampleRate);
        const d = buf.getChannelData(0);
        let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
        for (let i = 0; i < n; i++) {
          const w = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + w * 0.0555179;
          b1 = 0.99332 * b1 + w * 0.0750759;
          b2 = 0.96900 * b2 + w * 0.1538520;
          b3 = 0.86650 * b3 + w * 0.3104856;
          b4 = 0.55000 * b4 + w * 0.5329522;
          b5 = -0.7616 * b5 - w * 0.0168980;
          d[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.5362) * 0.11;
          b6 = w * 0.115926;
        }
        return buf;
      };

      // ===== Layer A: sustained crowd wash =====
      const washSrc = ctx.createBufferSource();
      washSrc.buffer = makePinkBuf(dur);
      const washBP = ctx.createBiquadFilter();
      washBP.type = 'bandpass';
      washBP.Q.value = 1.2;
      washBP.frequency.setValueAtTime(380, now);
      washBP.frequency.linearRampToValueAtTime(880, now + 0.30);
      washBP.frequency.linearRampToValueAtTime(620, now + 1.10);
      washBP.frequency.exponentialRampToValueAtTime(280, now + dur);
      const washHP = ctx.createBiquadFilter();
      washHP.type = 'highpass'; washHP.frequency.value = 180;
      const washAmp = ctx.createGain();
      washAmp.gain.setValueAtTime(0, now);
      washAmp.gain.linearRampToValueAtTime(0.45, now + 0.10);
      washAmp.gain.linearRampToValueAtTime(0.38, now + 1.4);
      washAmp.gain.exponentialRampToValueAtTime(0.001, now + dur);
      // Tremolo on wash (crowd shimmer)
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 9;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 0.10;
      lfo.connect(lfoGain).connect(washAmp.gain);
      washSrc.connect(washBP).connect(washHP).connect(washAmp);
      washAmp.connect(ctx.destination);
      washAmp.connect(reverb);
      washSrc.start(now); washSrc.stop(now + dur);
      lfo.start(now); lfo.stop(now + dur);

      // ===== Layer B: 18 individual voice bursts =====
      // Each voice = short bandpass-filtered pink noise with rising-falling pitch
      // Different start times, durations, and pitches to simulate distinct people
      for (let i = 0; i < 18; i++) {
        const t = now + 0.05 + Math.random() * (dur - 0.45);
        const vdur = 0.18 + Math.random() * 0.32;
        const voice = ctx.createBufferSource();
        voice.buffer = makePinkBuf(vdur);
        const vbp = ctx.createBiquadFilter();
        vbp.type = 'bandpass';
        vbp.Q.value = 4 + Math.random() * 4;
        // Each voice has its own pitch — F4 to A5 range to feel like distinct people
        const basePitch = 350 + Math.random() * 600;
        vbp.frequency.setValueAtTime(basePitch * 0.8, t);
        vbp.frequency.linearRampToValueAtTime(basePitch * 1.4, t + vdur * 0.4);
        vbp.frequency.linearRampToValueAtTime(basePitch, t + vdur);
        const vamp = ctx.createGain();
        vamp.gain.setValueAtTime(0, t);
        vamp.gain.linearRampToValueAtTime(0.18 + Math.random() * 0.12, t + 0.02);
        vamp.gain.linearRampToValueAtTime(0.12, t + vdur * 0.5);
        vamp.gain.exponentialRampToValueAtTime(0.001, t + vdur);
        // Pan slightly random for stereo spread feel (Web Audio mono → use slight delay/diff)
        voice.connect(vbp).connect(vamp).connect(ctx.destination);
        vamp.connect(reverb);
        voice.start(t);
        voice.stop(t + vdur);
      }

      // ===== Layer C: applause rhythm (clap density) =====
      // Many short noise transients ~7-9 per second
      const clapCount = Math.floor(dur * 8);
      for (let i = 0; i < clapCount; i++) {
        const t = now + 0.15 + (i / clapCount) * (dur - 0.4) + (Math.random() - 0.5) * 0.08;
        const cBufSize = ctx.sampleRate * 0.05;
        const cBuf = ctx.createBuffer(1, cBufSize, ctx.sampleRate);
        const cd = cBuf.getChannelData(0);
        for (let j = 0; j < cd.length; j++) {
          cd[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / cBufSize, 1.5);
        }
        const clap = ctx.createBufferSource();
        clap.buffer = cBuf;
        const cHP = ctx.createBiquadFilter();
        cHP.type = 'highpass'; cHP.frequency.value = 1800;
        const cAmp = ctx.createGain();
        cAmp.gain.value = 0.05 + Math.random() * 0.06;
        clap.connect(cHP).connect(cAmp).connect(ctx.destination);
        cAmp.connect(reverb);
        clap.start(t);
      }

      // ===== Layer D: 4 whistles (rising sine pings) =====
      for (let i = 0; i < 4; i++) {
        const t = now + 0.3 + Math.random() * (dur - 0.7);
        const wdur = 0.18 + Math.random() * 0.18;
        const whistle = ctx.createOscillator();
        const whG = ctx.createGain();
        whistle.type = 'sine';
        whistle.frequency.setValueAtTime(1800 + Math.random() * 600, t);
        whistle.frequency.linearRampToValueAtTime(2800 + Math.random() * 400, t + wdur);
        whG.gain.setValueAtTime(0, t);
        whG.gain.linearRampToValueAtTime(0.08, t + 0.015);
        whG.gain.exponentialRampToValueAtTime(0.001, t + wdur);
        whistle.connect(whG).connect(ctx.destination);
        whG.connect(reverb);
        whistle.start(t);
        whistle.stop(t + wdur + 0.05);
      }

      setTimeout(() => { try { ctx.close(); } catch(_){} }, 4500);
    } catch (_) { /* silent */ }
  }
  // Strict: play ONLY the cheers.mp3 file. No synth fallback (user explicit choice).
  function playCheer() {

  // Tiny click on every correct piece snap — sine pluck + noise tick
  function playSnapClick() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const oscG = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1400, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
      oscG.gain.setValueAtTime(0, now);
      oscG.gain.linearRampToValueAtTime(0.18, now + 0.003);
      oscG.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
      osc.connect(oscG).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.09);

      const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.025), ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.5);
      const noise = ctx.createBufferSource();
      noise.buffer = buf;
      const nG = ctx.createGain();
      nG.gain.value = 0.09;
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 1600;
      noise.connect(hp).connect(nG).connect(ctx.destination);
      noise.start(now);

      setTimeout(() => { try { ctx.close(); } catch(_){} }, 250);
    } catch (_) { /* silent */ }
  }

  // Only celebration sound = YouTube cheers.mp3 (user choice). No jingle, no pop.

  // ---------- Image preload ----------
  function preloadImage() {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = (e) => reject(new Error(`Failed to load ${IMAGE_SRC}`));
      img.src = IMAGE_SRC;
      imageEl = img;
    });
  }

  // ---------- Init ----------
  async function init() {
    try {
      await preloadImage();
    } catch (err) {
      const msg = document.createElement('div');
      msg.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0d0c;color:#fff;font-family:sans-serif;text-align:center;padding:24px;';
      msg.innerHTML = `<div><h2 style="color:#e2231a">Image not found</h2><p>Place <code>${IMAGE_SRC}</code> next to <code>index.html</code> and reload.</p></div>`;
      document.body.appendChild(msg);
      return;
    }
    wireControls();
    updateHintBtn();
    tryLoadAudioFiles();
    seedFakesIfEmpty();
    renderSidebarLB();
    buildEdges();
    buildPieces();
  }

  // Rebuild on resize (debounced)
  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      // Only rebuild if not in middle of solving — destructive, so just on initial sizing
      // For simplicity we skip live resize re-layout once pieces exist.
    }, 200);
  });

  // ---------- Restart ----------
  function restartGame(opts = {}) {
    // Tear down DOM
    document.getElementById('trayStage').innerHTML = '';
    document.getElementById('boardStage').querySelectorAll('.piece').forEach(p => p.remove());
    // Cancel ongoing animations
    document.querySelectorAll('.bottle-cap, .foam-blob, .snap-glow, .hint-pulse, .emoji-pop').forEach(n => n.remove());
    stopConfetti();
    document.body.classList.remove('party');
    document.getElementById('winOverlay').classList.remove('visible', 'party');
    document.getElementById('winDim').classList.remove('visible');

    // Reset state
    pieces = [];
    solvedCount = 0;
    hintsLeft = HINT_COUNT;
    updateHintBtn();
    solveTimeMs = 0;

    // Reset timer
    if (timerRunning) clearInterval(timerHandle);
    timerRunning = false;
    timerStart = 0;
    document.getElementById('timer').textContent = '00:00';

    // Apply mode flags from opts (or current)
    if ('hard' in opts) hardMode = opts.hard;
    if ('daily' in opts) dailyMode = opts.daily;

    // Re-seed if daily
    if (dailyMode) seedRng(dailySeed());

    // Mode badge text
    const badge = document.getElementById('modeBadge');
    const labels = [];
    if (dailyMode) labels.push(`DAILY ${dailyLabel()}`);
    if (hardMode) labels.push('HARD');
    badge.textContent = labels.length ? labels.join(' · ') : 'JIGSAW';

    // Active states
    document.getElementById('hardBtn').classList.toggle('active', hardMode);
    document.getElementById('dailyBtn').classList.toggle('active', dailyMode);

    // Rebuild
    buildEdges();
    buildPieces();
  }

  // ---------- Hint ----------
  function requestHint() {
    if (hintsLeft <= 0) return;
    const unplaced = pieces.filter(p => !p.locked);
    if (unplaced.length === 0) return;
    const target = unplaced[Math.floor(rngRandom() * unplaced.length)];
    flashSlot(target);
    hintsLeft--;
    updateHintBtn();
  }
  function updateHintBtn() {
    const btn = document.getElementById('hintBtn');
    document.getElementById('hintCount').textContent = hintsLeft;
    btn.disabled = hintsLeft <= 0;
  }
  function flashSlot(piece) {
    // Place pulse rect inside boardStage at piece.homeX/homeY relative to stage
    const stage = document.getElementById('boardStage');
    const pulse = document.createElement('div');
    pulse.className = 'hint-pulse';
    pulse.style.left = `${piece.homeX}px`;
    pulse.style.top = `${piece.homeY}px`;
    pulse.style.width = `${piece.bbW}px`;
    pulse.style.height = `${piece.bbH}px`;
    stage.appendChild(pulse);
    setTimeout(() => pulse.remove(), 2300);
  }

  ];

  function loadLB() {
    try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]'); }
    catch { return []; }
  }
  function saveLB(entries) {
    try { localStorage.setItem(LB_KEY, JSON.stringify(entries)); } catch (_) {}
  }
  function seedFakesIfEmpty() {
    if (localStorage.getItem(LB_SEEDED_KEY)) return;
    const existing = loadLB();
    if (existing.length === 0) {
      saveLB(FAKE_LB.slice().sort((a,b) => a.timeMs - b.timeMs));
    }
    try { localStorage.setItem(LB_SEEDED_KEY, '1'); } catch (_) {}
  }
  function addLB(entry) {
    const all = loadLB();
    all.push(entry);
    all.sort((a, b) => a.timeMs - b.timeMs);
    const trimmed = all.slice(0, 20);
    saveLB(trimmed);
    return trimmed;
  }

  // Sidebar leaderboard (always visible in left/tray panel)
  function renderSidebarLB(mineId) {
    const list = document.getElementById('lbSidebarList');
    if (!list) return;
    const entries = loadLB().slice(0, 10);
    if (entries.length === 0) {
      list.innerHTML = '<li class="lb-empty" style="display:block; padding:20px; opacity:0.5; font-style:italic; grid-template-columns:none; text-align:center;">No times yet</li>';
      return;
    }
    list.innerHTML = entries.map((e, i) => {
      const isMe = (mineId != null && e.id === mineId);
      const medal = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
      const cls = [medal, isMe ? 'me' : ''].filter(Boolean).join(' ');
      return `
        <li class="${cls}">
          <span class="rank">${i+1}</span>
          <span class="name">${escapeHtml(e.name)}<span class="mode-pill">${escapeHtml(e.mode || 'Normal')}</span></span>
          <span class="time">${fmtTime(e.timeMs)}</span>
        </li>`;
    }).join('');
  }
  function modeLabel() {
    const parts = [];
    if (dailyMode) parts.push(`Daily ${dailyLabel()}`);
    if (hardMode) parts.push('Hard');
    return parts.length ? parts.join(' · ') : 'Normal';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[m]));
  }
