    `;
  }

  function showNamePrompt(timeText, mode, timeMs) {
    const content = document.getElementById('winContent');
    content.innerHTML = renderNameForm(timeText, mode);

    const input = document.getElementById('nameInput');
    // Pre-fill from last-used name
    try { input.value = (localStorage.getItem(LB_NAME_KEY) || '').toUpperCase(); } catch (_) {}
    // Focus after a tick so animations don't fight focus
    setTimeout(() => { try { input.focus(); input.select(); } catch (_) {} }, 350);

    const onSubmit = (skip) => {
      const raw = (input.value || '').trim();
      const name = skip ? 'ANON' : (raw.toUpperCase() || 'PLAYER');
      if (!skip) {
        try { localStorage.setItem(LB_NAME_KEY, name); } catch (_) {}
      }
      const id = Date.now() + Math.floor(Math.random() * 1000);
      const entry = { id, name, timeMs, mode, date: new Date().toISOString() };
      const all = addLB(entry);
      renderSidebarLB(id);
      showLeaderboardView(all, id);
    };

    document.getElementById('saveBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      onSubmit(false);
    });
    document.getElementById('skipBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      onSubmit(true);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); onSubmit(false); }
    });
    // Stop clicks inside input from dismissing party
    input.addEventListener('click', (e) => e.stopPropagation());
  }

  function showLeaderboardView(entries, mineId) {
    const content = document.getElementById('winContent');
    content.innerHTML = renderLeaderboard(entries, mineId);
    const shareBtn = document.getElementById('shareBtn');
    const playBtn = document.getElementById('playAgainBtn');
    const clearBtn = document.getElementById('clearLbBtn');
    if (shareBtn) shareBtn.addEventListener('click', (e) => { e.stopPropagation(); shareResult(mineId); });
    if (playBtn) playBtn.addEventListener('click', (e) => { e.stopPropagation(); restartGame(); });
    if (clearBtn) clearBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm('Clear all leaderboard times?')) {
        saveLB([]);
        // Re-seed fakes so the board never sits empty
        try { localStorage.removeItem(LB_SEEDED_KEY); } catch (_) {}
        seedFakesIfEmpty();
        const all = loadLB();
        showLeaderboardView(all, null);
        renderSidebarLB();
      }
    });

    // Scroll player's row into view
    if (mineId != null) {
      setTimeout(() => {
        const meEl = content.querySelector('.lb li.me');
        if (meEl) meEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 200);
    }
  }

  // Standalone leaderboard view (from header LEADERS button, no name entry)
  function openLeaderboardModal() {
    const overlay = document.getElementById('winOverlay');
    const dim = document.getElementById('winDim');
    showLeaderboardView(loadLB(), null);
    dim.classList.add('visible');
    overlay.classList.add('visible');
    const dismiss = (e) => {
      if (e.target.closest('.win-card')) return;
      overlay.classList.remove('visible', 'party');
      dim.classList.remove('visible');
      overlay.removeEventListener('click', dismiss);
    };
    overlay.addEventListener('click', dismiss);
  }

  // ---------- Share ----------
  function buildShareText(mineId) {
    const url = location.origin + location.pathname;
    const time = document.getElementById('timer').textContent;
    let prefix = 'Heineken Jigsaw';
    if (dailyMode) prefix += ` Daily ${dailyLabel()}`;
    if (hardMode) prefix += ' (Hard)';
    let rankStr = '';
    if (mineId != null) {
      const all = loadLB();
      const idx = all.findIndex(e => e.id === mineId);
      if (idx >= 0) rankStr = ` · Rank #${idx+1}`;
    }
    return `${prefix} — solved in ${time} 🍻${rankStr}\n${url}`;
  }
  async function shareResult(mineId) {
    const text = buildShareText(mineId);
    try {
      if (navigator.share) {
        await navigator.share({ title: 'Heineken Jigsaw', text });
        return;
      }
    } catch (_) { /* user cancelled or unsupported */ }
    try {
      await navigator.clipboard.writeText(text);
      showToast('Copied to clipboard');
    } catch (_) {
      // Fallback: prompt
      window.prompt('Copy this:', text);
    }
  }
  function showToast(msg) {
    let t = document.querySelector('.toast');
    if (!t) {
      t = document.createElement('div');
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- Controls wiring ----------
  function wireControls() {
    document.getElementById('restartBtn').addEventListener('click', () => restartGame());
    document.getElementById('hintBtn').addEventListener('click', requestHint);
    document.getElementById('hardBtn').addEventListener('click', () => restartGame({ hard: !hardMode }));
    document.getElementById('dailyBtn').addEventListener('click', () => restartGame({ daily: !dailyMode }));
    document.getElementById('lbBtn').addEventListener('click', openLeaderboardModal);
  }

  // Dev shortcut: press "W" to auto-solve (preview party).
  // Press "C" to fire confetti standalone without affecting puzzle state.
  window.addEventListener('keydown', (e) => {
    if (e.key === 'w' || e.key === 'W') {
      pieces.forEach(p => {
        if (p.locked) return;
        document.getElementById('boardStage').appendChild(p.el);
        p.parent = 'board';
        p.x = p.homeX;
        p.y = p.homeY;
        p.rot = 0;
        p.locked = true;
        p.el.classList.add('locked');
        positionPiece(p);
        solvedCount++;
      });
      checkWin(); // triggers bottle-open + party via standard sequence
    } else if (e.key === 'c' || e.key === 'C') {
      fireConfetti();
      spawnEmojiBursts();
      playFanfare();
    }
  });

  // Boot
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
